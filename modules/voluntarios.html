<style>
    .vl-wrap { display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden;font-family:var(--font-body);background:var(--bg-page); }
    .vl-tabs { display:flex;border-bottom:1px solid var(--border);background:var(--bg-card);flex-shrink:0;overflow-x:auto;scrollbar-width:none; }
    .vl-tabs::-webkit-scrollbar { display:none; }
    .vl-tab { padding:10px 18px;font-family:var(--font-title);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;border-top:none;border-left:none;border-right:none;background:none;transition:all 0.12s;white-space:nowrap; }
    .vl-tab:hover { color:var(--text-main); }
    .vl-tab.active { color:var(--primary-dark);border-bottom-color:var(--primary); }
    .vl-content { flex:1;overflow-y:auto;padding:16px; }
    .vl-toolbar { display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px; }
    .vl-toolbar-title { font-family:var(--font-title);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--primary-dark); }
    .vl-card { background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px; }
    .vl-card-title { font-family:var(--font-title);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border); }
    .vl-table { width:100%;border-collapse:collapse;font-size:12px; }
    .vl-table th { text-align:left;font-family:var(--font-title);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg-input);white-space:nowrap; }
    .vl-table td { padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle; }
    .vl-table tr:last-child td { border-bottom:none; }
    .vl-table tr:hover td { background:var(--primary-faint); }
    .vl-badge { display:inline-block;padding:2px 8px;border-radius:20px;font-family:var(--font-title);font-size:8px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:#fff; }
    .vl-b-pendente{background:#6b7280}.vl-b-em_atribuicao{background:#b45309}.vl-b-aprovado{background:#15803d}.vl-b-recusado{background:#b91c1c}.vl-b-sem_retorno{background:#9f1239}.vl-b-ativo{background:#15803d}.vl-b-inativo{background:#6b7280}.vl-b-rascunho{background:#64748b}.vl-b-encerrado{background:#374151}
    .vl-b-presente{background:#15803d}.vl-b-atrasado{background:#b45309}.vl-b-faltou{background:#b91c1c}.vl-b-pre_confirmado{background:#0e7490}.vl-b-sem_registo{background:#6b7280}
    .vl-b-anotacao{background:var(--primary-dark,#0e7490)}.vl-b-feedback{background:#b45309}.vl-b-interacao{background:#15803d}.vl-b-conversa{background:#1d4ed8}
    .vl-btn { padding:6px 12px;border-radius:8px;border:none;font-family:var(--font-title);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.12s;white-space:nowrap;color:#fff; }
    .vl-btn-p{background:var(--primary,#0e7490)}.vl-btn-p:hover{background:var(--primary-dark,#0c6070)}
    .vl-btn-o{background:var(--bg-input);color:var(--text-main);border:1px solid var(--border)}.vl-btn-o:hover{border-color:var(--primary);color:var(--primary-dark)}
    .vl-btn-m{background:var(--bg-input);color:var(--text-faint);border:1px solid var(--border)}.vl-btn-m:hover{color:var(--text-main);border-color:var(--primary)}
    .vl-btn-d{background:#991b1b;color:#fff}.vl-btn-d:hover{background:#7f1d1d}
    .vl-btn:disabled{opacity:0.4;cursor:not-allowed}
    .vl-field{margin-bottom:10px}
    .vl-label{display:block;font-family:var(--font-title);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
    .vl-input,.vl-select,.vl-textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text-main);font-family:var(--font-body);font-size:12px;padding:7px 10px;outline:none;transition:border-color 0.15s;box-sizing:border-box}
    .vl-input:focus,.vl-select:focus,.vl-textarea:focus{border-color:var(--primary)}
    .vl-textarea{resize:vertical;min-height:65px}
    .vl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
    .vl-row .vl-field{flex:1;min-width:130px;margin-bottom:0}
    .vl-stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .vl-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;flex:1;min-width:80px}
    .vl-stat-num{font-family:var(--font-title);font-size:18px;font-weight:700;color:var(--primary-dark)}
    .vl-stat-label{font-size:8px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
    .vl-stats-section{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
    .vl-stats-section-title{font-family:var(--font-title);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .vl-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
    .vl-stat-mini{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center}
    .vl-stat-mini-num{font-family:var(--font-title);font-size:16px;font-weight:700;color:var(--primary-dark)}
    .vl-stat-mini-label{font-size:8px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
    .vl-alert{padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px}
    .vl-alert-e{background:rgba(185,28,28,0.1);border:1px solid rgba(185,28,28,0.3);color:var(--text-main)}
    .vl-alert-s{background:rgba(21,128,61,0.1);border:1px solid rgba(21,128,61,0.3);color:var(--text-main)}
    .vl-alert-i{background:var(--primary-faint);border:1px solid var(--border);color:var(--text-main)}
    .vl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
    .vl-modal{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
    .vl-modal-title{font-family:var(--font-title);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--primary-dark);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--border)}
    .vl-modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
    .vl-modal-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
    .vl-modal-tab{padding:7px 14px;font-family:var(--font-title);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:all 0.12s}
    .vl-modal-tab:hover{color:var(--text-main)}
    .vl-modal-tab.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
    .vl-modal-tab-content{display:none}
    .vl-modal-tab-content.active{display:block}
    .vl-anot-item{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:7px}
    .vl-anot-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .vl-anot-data{font-size:9px;color:var(--text-faint);font-family:var(--font-title);letter-spacing:0.5px;margin-left:auto}
    .vl-anot-texto{font-size:12px;color:var(--text-main);line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .vl-expand-body td{background:var(--bg-input);padding:11px 10px}
    .vl-hidden{display:none}
    .vl-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;background:var(--primary-faint);border:1px solid var(--border);color:var(--primary-dark);margin:1px;font-family:var(--font-title);letter-spacing:0.5px}
    .vl-link-box{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-top:5px}
    .vl-link-box code{flex:1;font-size:10px;color:var(--text-faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:monospace}
    .vl-motivo-box{background:rgba(185,28,28,0.06);border:1px solid rgba(185,28,28,0.2);border-radius:7px;padding:8px 11px;margin-top:5px}
    .vl-motivo-label{font-family:var(--font-title);font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);margin-bottom:3px}
    .vl-motivo-texto{font-size:11px;color:var(--text-main);font-style:italic}
    .vl-empty{text-align:center;padding:44px 20px;color:var(--text-faint);font-size:12px}
    .vl-empty-icon{font-size:18px;margin-bottom:8px;opacity:0.35;font-family:var(--font-title);letter-spacing:2px}
    .vl-campanha-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
    .vl-campanha-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
    .vl-campanha-nome{font-family:var(--font-title);font-size:10px;letter-spacing:1px;color:var(--text-main)}
    .vl-campanha-datas{font-size:10px;color:var(--text-faint);margin-top:2px}
    .vl-sep{border:none;border-top:1px solid var(--border);margin:10px 0}
    .vl-btn-row{display:flex;gap:6px;flex-wrap:wrap}

    /* ── Filtros compactos (inline) ── */
    .vl-filter-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        align-items: center;
    }
    .vl-filter-bar .vl-input,
    .vl-filter-bar .vl-select {
        padding: 5px 8px;
        font-size: 11px;
        height: 30px;
        box-sizing: border-box;
    }

    /* ── Presenças ── */
    .pr-month-block{margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .pr-month-hd{background:var(--bg-input);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
    .pr-month-nome{font-family:var(--font-title);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--primary-dark)}
    .pr-month-stats{display:flex;gap:6px}
    .pr-stat-pill{font-size:8px;padding:2px 8px;border-radius:20px;font-family:var(--font-title);letter-spacing:0.5px;color:#fff}
    .pr-day-block{border-bottom:1px solid var(--border)}
    .pr-day-block:last-child{border-bottom:none}
    .pr-day-hd{padding:6px 14px;background:var(--bg-card);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
    .pr-day-date{font-family:var(--font-title);font-size:9px;letter-spacing:1px;color:var(--text-main)}
    .pr-day-culto{font-size:10px;color:var(--text-faint)}
    .pr-multi-tag{font-size:8px;padding:1px 6px;border-radius:20px;background:var(--primary,#0e7490);color:#fff;font-family:var(--font-title);letter-spacing:0.5px}

    /* placeholder state presenças */
    .pr-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        gap: 12px;
        background: var(--bg-card);
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--text-faint);
        font-size: 12px;
        text-align: center;
    }
    .pr-placeholder-icon {
        font-family: var(--font-title);
        font-size: 22px;
        letter-spacing: 3px;
        opacity: 0.3;
    }

    @media print {
        .vl-tabs,.vl-toolbar button,.vl-btn,input,select,.vl-btn-row,.pr-no-print{display:none!important}
        .vl-content{overflow:visible;padding:0}
        .vl-table th,.vl-table td{font-size:10px;padding:5px 7px}
    }
    td{padding:6px 8px;border:1px solid #ddd;font-size:10px;vertical-align:middle}
    img{display:block;margin:auto}
</style>

<div class="vl-wrap" id="vl-wrap">
    <div class="vl-tabs">
        <button class="vl-tab active" id="vl-tab-ativos"     onclick="vl_setTab('ativos')">Voluntários Ativos</button>
        <button class="vl-tab"        id="vl-tab-inscricoes" onclick="vl_setTab('inscricoes')">Novas Inscrições</button>
        <button class="vl-tab"        id="vl-tab-campanhas"  onclick="vl_setTab('campanhas')">Campanhas</button>
        <button class="vl-tab"        id="vl-tab-presencas"  onclick="vl_setTab('presencas')">Presenças</button>
        <button class="vl-tab"        id="vl-tab-relatorio"  onclick="vl_setTab('relatorio')">Relatório Culto</button>
    </div>
    <div class="vl-content" id="vl-content">
        <div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar...</div>
    </div>
</div>

<script>
    (function () {
        const sb = window.sb;

        /* ── SVG WhatsApp reutilizável ── */
        const WA_SVG = `<svg viewBox="0 0 24 24" width="14" height="14" fill="#25D366" style="vertical-align:middle;flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>`;

        function waLink(telefone) {
            if (!telefone) return '';
            return `<a href="https://wa.me/${telefone.replace(/\D/g,'')}" target="_blank"
                   title="WhatsApp" style="display:inline-flex;align-items:center;text-decoration:none;margin-left:4px">${WA_SVG}</a>`;
        }

        function fmt(dt) {
            if (!dt) return '—';
            return new Date(dt).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
        }
        function fmtD(dt) {
            if (!dt) return '—';
            return new Date(dt).toLocaleDateString('pt-PT');
        }
        function fmtMes(yyyymm) {
            const [y,m] = yyyymm.split('-');
            const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
            return `${meses[parseInt(m)-1]} ${y}`;
        }
        function fmtDataExtensa(iso) {
            const d = new Date(iso+'T00:00:00');
            const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
            return `${dias[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }
        function mesAtualISO() {
            const n=new Date(), y=n.getFullYear(), m=String(n.getMonth()+1).padStart(2,'0');
            const last=new Date(y,n.getMonth()+1,0).getDate();
            return {start:`${y}-${m}-01`, end:`${y}-${m}-${last}`};
        }
        function c() { return document.getElementById('vl-content'); }

        /* ── Helper: nome ministério com parent ── */
        function vl_minNomeComParent(minId, minsList) {
            const min = minsList.find(m => m.id === minId);
            if (!min) return '—';
            if (min.parent_id) {
                const parent = minsList.find(m => m.id === min.parent_id);
                if (parent) return `${min.nome} <span style="font-size:9px;color:var(--text-faint);font-weight:400">(${parent.nome})</span>`;
            }
            return min.nome;
        }

        /* ── Label culto com campus ── */
        function cultoLabel(cu) {
            if (!cu) return '—';
            const campus = cu.campus?.nome ? `<span style="font-size:9px;color:var(--primary-dark);font-family:var(--font-title);letter-spacing:0.5px;text-transform:uppercase;margin-right:4px">${cu.campus.nome}</span>` : '';
            const hora = cu.hora_inicio ? ' · ' + cu.hora_inicio.slice(0,5) : '';
            return `${campus}${cu.nome}${hora}`;
        }
        function cultoLabelText(cu) {
            if (!cu) return '—';
            const campus = cu.campus?.nome ? cu.campus.nome + ' · ' : '';
            const hora = cu.hora_inicio ? ' · ' + cu.hora_inicio.slice(0,5) : '';
            return `${campus}${cu.nome}${hora}`;
        }

        /* ══ ESTADO GLOBAL ══ */
        let vl_tabAtiva = 'ativos';
        let vl_campFiltro = null;
        let vl_membrosCache = [];
        let vl_funcoesList = [];
        let _vl_func = '';

        function buildMinHierarchyOpts(lista, placeholderTxt) {
            const raizes = lista.filter(m => !m.parent_id);
            const filhos = (pid) => lista.filter(m => m.parent_id === pid);
            let html = `<option value="">${placeholderTxt||'Todos'}</option>`;
            raizes.forEach(raiz => {
                html += `<option value="${raiz.id}" style="font-weight:700;color:var(--primary-dark)">▸ ${raiz.nome.toUpperCase()}</option>`;
                filhos(raiz.id).forEach(area => {
                    html += `<option value="${area.id}">　${area.nome}</option>`;
                    filhos(area.id).forEach(sub => {
                        html += `<option value="${sub.id}">　　↳ ${sub.nome}</option>`;
                    });
                });
            });
            return html;
        }

        function getDescendantesIds(lista, id) {
            const filhos = lista.filter(m => m.parent_id === id).map(m => m.id);
            return [...filhos, ...filhos.flatMap(fid => getDescendantesIds(lista, fid))];
        }

        /* ══ INIT ══ */
        async function vl_init() {
            try { vl_membrosCache = await sb('membros?select=id,nome,e_voluntario&ativo=eq.true&order=nome') || []; } catch (_) {}
            vl_verificarPrazos();
            vl_renderAtivos();
        }

        /* ══ TABS ══ */
        function vl_setTab(tab) {
            vl_tabAtiva = tab;
            ['ativos','inscricoes','campanhas','presencas','relatorio'].forEach(t => {
                document.getElementById(`vl-tab-${t}`)?.classList.toggle('active', t === tab);
            });
            if (tab === 'ativos')     vl_renderAtivos();
            if (tab === 'inscricoes') vl_renderInscricoes();
            if (tab === 'campanhas')  vl_renderCampanhas();
            if (tab === 'presencas')  vl_renderPresencas();
            if (tab === 'relatorio')  vl_renderRelatorio();
        }

        /* ══════════════════════════════════════════
           ABA 1 — VOLUNTÁRIOS ATIVOS
        ══════════════════════════════════════════ */
        let vl_ativosCache = [], vl_ministeriosList = [], vl_idiomasList = [], vl_nacList = [];
        let _vl_q = '', _vl_min = '', _vl_idi = '', _vl_nac = '';

        async function vl_renderAtivos() {
            c().innerHTML = '<div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar...</div>';
            try {
                const membros = await sb('membros?e_voluntario=eq.true&ativo=eq.true&select=id,nome,email,telefone,Idiomas,nacionalidade,funcao_voluntario,foto_url&order=nome') || [];
                let minsMap = {}, minsRaw = [];
                if (membros.length) {
                    const ids = membros.map(m => m.id).join(',');
                    minsRaw = await sb(`membro_ministerios?membro_id=in.(${ids})&ativo=eq.true&select=id,membro_id,papel,ministerios(id,nome)`).catch(() => []);
                    (minsRaw||[]).forEach(v => {
                        if (!minsMap[v.membro_id]) minsMap[v.membro_id] = [];
                        minsMap[v.membro_id].push({id:v.ministerios?.id,nome:v.ministerios?.nome,papel:v.papel,vinc_id:v.id});
                    });
                }
                vl_ativosCache = membros.map(m => ({...m,_ministerios:minsMap[m.id]||[],_idiomasArr:vl_parseIdiomas(m.Idiomas),_nac:vl_parseNac(m.nacionalidade),_foto:m.foto_url||null}));
                const todosMinRaw = await sb('ministerios?ativo=eq.true&select=id,nome,parent_id&order=nome').catch(() => []);
                vl_ministeriosList = todosMinRaw;
                const idSet=new Set(), nacSet=new Set();
                vl_ativosCache.forEach(m => {
                    m._idiomasArr.forEach(i => idSet.add(i));
                    m._nac.split(',').map(n=>n.trim()).filter(Boolean).forEach(n => nacSet.add(n));

                vl_idiomasList = [...idSet].sort();
                vl_nacList = [...nacSet].sort();

        function vl_parseIdiomas(val) {
            if (!val) return [];

        }
        function vl_parseNac(val) {
            if (val==null) return '';
            if (Array.isArray(val)) return val.filter(Boolean).join(', ');
            if (typeof val==='string') {
                const trim=val.trim();
                if (trim.startsWith('[')) { try { const arr=JSON.parse(trim); return Array.isArray(arr)?arr.filter(Boolean).join(', '):trim; } catch(_){} }

            }

        function vl_imprimirAtivos() {
            const q=_vl_q.toLowerCase(); let lista=[...vl_ativosCache];
            if(q) lista=lista.filter(m=>m.nome.toLowerCase().includes(q));
            if(_vl_min) lista=lista.filter(m=>m._ministerios.some(mn=>mn.id===_vl_min));
            if(_vl_idi) lista=lista.filter(m=>m._idiomasArr.includes(_vl_idi));
            if(_vl_nac) lista=lista.filter(m=>m._nac.split(',').map(n=>n.trim()).includes(_vl_nac));
            const rows=lista.map(v=>{
                const fotoHtml=v._foto?`<img src="${v._foto}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #ddd">`:`<div style="width:36px;height:36px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#374151">${v.nome.split(' ').slice(0,2).map(p=>p[0]).join('')}</div>`;
                return `<tr><td style="text-align:center">${fotoHtml}</td><td>${v.nome}</td><td>${v._ministerios.map(m=>m.nome).join(', ')||'—'}</td><td>${v.telefone||'—'}</td><td>${v.email||'—'}</td><td>${v._idiomasArr.join(', ')||'—'}</td><td>${v._nac||'—'}</td></tr>`;

            win.document.close();
        }

        async function vl_removerVoluntario(membroId, nome) {
            if (!confirm(`Remover ${nome} da lista de voluntários?\n\nA pessoa perderá o status de voluntário e será removida de todos os ministérios associados.`)) return;
            try {
                await sb(`membros?id=eq.${membroId}`,{method:'PATCH',body:JSON.stringify({e_voluntario:false})});
                await sb(`membro_ministerios?membro_id=eq.${membroId}`,{method:'PATCH',body:JSON.stringify({ativo:false})}).catch(()=>{});
                vl_ativosCache=vl_ativosCache.filter(m=>m.id!==membroId);
                const idx=vl_membrosCache.findIndex(m=>m.id===membroId); if(idx>=0)vl_membrosCache[idx].e_voluntario=false;
                vl_renderAtivosFiltrado();
            } catch(e) { alert('Erro: '+(e?.message||JSON.stringify(e))); }
        }

        /* ── Rejeitar ── */
        function vl_abrirRejeitar(inscricaoId, nome) {
            const ov=document.createElement('div'); ov.className='vl-modal-overlay'; ov.id='vl-rejeitar-modal';
            ov.innerHTML=`<div class="vl-modal" style="max-width:440px"><div class="vl-modal-title">Rejeitar Inscrição${nome?' — '+nome:''}</div><div class="vl-field"><label class="vl-label">Motivo</label><textarea class="vl-textarea" id="vl-rej-motivo" style="min-height:90px" placeholder="Ex: Sem vagas no ministério indicado..."></textarea></div><div id="vl-rej-alert"></div><div class="vl-modal-footer"><button class="vl-btn vl-btn-m" onclick="document.getElementById('vl-rejeitar-modal').remove()">Cancelar</button><button class="vl-btn vl-btn-d" onclick="vl_confirmarRejeitar('${inscricaoId}',this)">Confirmar Rejeição</button></div></div>`;
            document.body.appendChild(ov); setTimeout(()=>document.getElementById('vl-rej-motivo')?.focus(),80);
        }
        async function vl_confirmarRejeitar(inscricaoId, btn) {
            const motivo=document.getElementById('vl-rej-motivo')?.value?.trim();
            const alEl=document.getElementById('vl-rej-alert');
            if (!motivo) { if(alEl)alEl.innerHTML='<div class="vl-alert vl-alert-e">O motivo é obrigatório.</div>'; return; }
            btn.disabled=true; btn.textContent='A rejeitar...';
            try {
                await sb(`voluntarios_inscricoes?id=eq.${inscricaoId}`,{method:'PATCH',body:JSON.stringify({status:'recusado',motivo_rejeicao:motivo})});
                const idx=_ins_cache.findIndex(i=>i.id===inscricaoId);
                if(idx>=0){_ins_cache[idx].status='recusado';_ins_cache[idx].motivo_rejeicao=motivo;}
                document.getElementById('vl-rejeitar-modal')?.remove(); vl_filtrarInscricoes();
            } catch(e) { if(alEl)alEl.innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message}</div>`; btn.disabled=false; btn.textContent='Confirmar Rejeição'; }
        }

        function vl_mostrarLinkLider(link, ministerioNome) {
            const ov=document.createElement('div'); ov.className='vl-modal-overlay';
            ov.innerHTML=`<div class="vl-modal" style="max-width:480px"><div class="vl-modal-title">Link do Líder — ${ministerioNome}</div><div class="vl-link-box" style="margin-bottom:10px"><code style="font-size:11px;word-break:break-all;white-space:normal">${link}</code></div><div style="display:flex;gap:8px"><button class="vl-btn vl-btn-p" style="flex:1" onclick="navigator.clipboard.writeText('${link}');this.textContent='Copiado!';setTimeout(()=>this.textContent='Copiar',1500)">Copiar</button></div><div class="vl-modal-footer"><button class="vl-btn vl-btn-m" onclick="this.closest('.vl-modal-overlay').remove()">Fechar</button></div></div>`;
            document.body.appendChild(ov);
        }

        async function vl_aprovar(inscricaoId) {
            const ins=_ins_cache.find(i=>i.id===inscricaoId); if(!ins){vl_renderInscricoes();return;}
            const atrib=(ins._atribuicoes||[]).find(a=>a.status==='contatado')||ins._atribuicoes?.[0];
            const nomMin=atrib?.ministerios?.nome||ins._areas.find(a=>a.ordem===1)?.ministerios?.nome||'—';
            if (!confirm(`Aprovar ${ins._membro?.nome||'este candidato'} como voluntário em "${nomMin}"?`)) return;
            try {
                const ministerioId=atrib?.ministerio_id||ins._areas.find(a=>a.ordem===1)?.ministerio_id;
                await sb(`membros?id=eq.${ins.membro_id}`,{method:'PATCH',body:JSON.stringify({e_voluntario:true})});
                if (ministerioId) {
                    const jaAssoc=await sb(`membro_ministerios?membro_id=eq.${ins.membro_id}&ministerio_id=eq.${ministerioId}&ativo=eq.true&select=id&limit=1`).catch(()=>[]);
                    if (!jaAssoc.length) await sb('membro_ministerios',{method:'POST',body:JSON.stringify({membro_id:ins.membro_id,ministerio_id:ministerioId,papel:'Voluntário',ativo:true})}).catch(()=>{});
                }
                await sb(`voluntarios_inscricoes?id=eq.${inscricaoId}`,{method:'PATCH',body:JSON.stringify({status:'aprovado'})});
                const idx=_ins_cache.findIndex(i=>i.id===inscricaoId); if(idx>=0)_ins_cache[idx].status='aprovado';
                vl_filtrarInscricoes();
            } catch(e) { alert('Erro: '+(e?.message||JSON.stringify(e))); }
        }

        async function vl_distribuirTodos(campanhaId) {
            const pendentes=await sb(`voluntarios_inscricoes?campanha_id=eq.${campanhaId}&status=eq.pendente&select=id`).catch(()=>[]);
            if (!pendentes.length){alert('Nenhuma inscrição pendente.');return;}
            if (!confirm(`Distribuir ${pendentes.length} inscrição(ões)?`)) return;
            const prazo=new Date(Date.now()+7*24*60*60*1000).toISOString();
            for (const ins of pendentes) {
                const areas=await sb(`voluntarios_areas_interesse?inscricao_id=eq.${ins.id}&select=ministerio_id,ordem&order=ordem&limit=1`).catch(()=>[]);
                const a1=areas?.[0]; if(!a1)continue;
                await sb('voluntarios_atribuicoes',{method:'POST',body:JSON.stringify({inscricao_id:ins.id,ministerio_id:a1.ministerio_id,prazo_contato:prazo})}).catch(()=>{});
                await sb(`voluntarios_inscricoes?id=eq.${ins.id}`,{method:'PATCH',body:JSON.stringify({status:'em_atribuicao'})});
            }
            const el=document.getElementById('vl-alert-ins');
            if(el){el.innerHTML='<div class="vl-alert vl-alert-s">Inscrições distribuídas.</div>';setTimeout(()=>el.innerHTML='',4000);}
            vl_renderInscricoes();
        }

        async function vl_abrirDistribuir(inscricaoId) {
            const areas=await sb(`voluntarios_areas_interesse?inscricao_id=eq.${inscricaoId}&select=ordem,ministerios(id,nome)&order=ordem`).catch(()=>[]);
            const prazoDefault=new Date(Date.now()+7*24*60*60*1000).toISOString().slice(0,10);
            const opts=(areas||[]).map(a=>`<option value="${a.ministerios?.id}">${a.ordem}. ${a.ministerios?.nome}</option>`).join('');
            const ov=document.createElement('div'); ov.className='vl-modal-overlay';
            ov.innerHTML=`<div class="vl-modal"><div class="vl-modal-title">Distribuir Inscrição</div><div class="vl-field"><label class="vl-label">Ministério de destino</label><select class="vl-select" id="vl-dist-min">${opts}</select></div><div class="vl-field"><label class="vl-label">Prazo do líder</label><input type="date" class="vl-input" id="vl-dist-prazo" value="${prazoDefault}" min="${new Date().toISOString().slice(0,10)}"></div><div id="vl-dist-alert"></div><div class="vl-modal-footer"><button class="vl-btn vl-btn-m" onclick="this.closest('.vl-modal-overlay').remove()">Cancelar</button><button class="vl-btn vl-btn-p" onclick="vl_confirmarDistribuir('${inscricaoId}',this)">Confirmar</button></div></div>`;
            document.body.appendChild(ov);
        }
        async function vl_confirmarDistribuir(id, btn) {
            const min=document.getElementById('vl-dist-min')?.value, prazo=document.getElementById('vl-dist-prazo')?.value;
            const alEl=document.getElementById('vl-dist-alert');
            if(!min||!prazo){if(alEl)alEl.innerHTML='<div class="vl-alert vl-alert-e">Preencha todos os campos.</div>';return;}
            btn.disabled=true; btn.textContent='A guardar...';
            try {
                await sb('voluntarios_atribuicoes',{method:'POST',body:JSON.stringify({inscricao_id:id,ministerio_id:min,prazo_contato:new Date(prazo).toISOString()})});
                await sb(`voluntarios_inscricoes?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'em_atribuicao'})});
                btn.closest('.vl-modal-overlay').remove(); vl_renderInscricoes();
            } catch(e) { if(alEl)alEl.innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message||'Verifique se já existe atribuição.'}</div>`; btn.disabled=false; btn.textContent='Confirmar'; }
        }

        /* ══════════════════════════════════════════
           ABA 3 — CAMPANHAS
        ══════════════════════════════════════════ */
        async function vl_renderCampanhas() {
            c().innerHTML='<div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar...</div>';
            let rows=[];
            try { rows=await sb('voluntarios_campanhas?select=*&order=created_at.desc')||[]; } catch(e){c().innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message}</div>`;return;}
            const base=`${location.origin}/voluntarios-captacao.html`;
            const cards=!rows.length?'<div class="vl-empty"><div class="vl-empty-icon">—</div>Nenhuma campanha criada.</div>':rows.map(camp=>{
                const link=`${base}?c=${camp.slug}`;
                return `<div class="vl-campanha-card"><div class="vl-campanha-header"><div><div class="vl-campanha-nome">${camp.nome}</div><div class="vl-campanha-datas">${camp.data_inicio} até ${camp.data_fim}</div>${camp.descricao?`<div style="font-size:11px;color:var(--text-faint);margin-top:3px">${camp.descricao}</div>`:''}</div><span class="vl-badge vl-b-${camp.status}">${camp.status}</span></div><div class="vl-link-box"><code>${link}</code><button class="vl-btn vl-btn-m" style="padding:3px 9px;font-size:8px" onclick="navigator.clipboard.writeText('${link}');this.textContent='Copiado!'">Copiar</button></div><hr class="vl-sep"><div class="vl-btn-row">${camp.status==='rascunho'?`<button class="vl-btn vl-btn-p" onclick="vl_statusCampanha('${camp.id}','ativo')">Ativar</button>`:''}${camp.status==='ativo'?`<button class="vl-btn vl-btn-d" onclick="vl_statusCampanha('${camp.id}','encerrado')">Encerrar</button>`:''}${camp.status==='encerrado'?`<button class="vl-btn vl-btn-o" onclick="vl_gerarLinks('${camp.id}')">Gerar Links de Líderes</button>`:''}<button class="vl-btn vl-btn-m" onclick="vl_campFiltro='${camp.id}';vl_setTab('inscricoes')">Ver Inscrições</button></div></div>`;
            }).join('');
            c().innerHTML=`<div class="vl-toolbar"><span class="vl-toolbar-title">Campanhas</span><button class="vl-btn vl-btn-p" onclick="vl_novaCampanha()">Nova Campanha</button></div><div id="vl-alert-camp"></div>${cards}`;
        }

        function vl_novaCampanha() {
            const ov=document.createElement('div'); ov.className='vl-modal-overlay';
            ov.innerHTML=`<div class="vl-modal"><div class="vl-modal-title">Nova Campanha</div><div class="vl-field"><label class="vl-label">Nome</label><input type="text" class="vl-input" id="nc-nome" placeholder="Ex: Novos Voluntários Maio 2026"></div><div class="vl-field"><label class="vl-label">Descrição (opcional)</label><textarea class="vl-textarea" id="nc-desc"></textarea></div><div class="vl-row"><div class="vl-field"><label class="vl-label">Data início</label><input type="date" class="vl-input" id="nc-inicio"></div><div class="vl-field"><label class="vl-label">Data fim</label><input type="date" class="vl-input" id="nc-fim"></div></div><div id="nc-alert"></div><div class="vl-modal-footer"><button class="vl-btn vl-btn-m" onclick="this.closest('.vl-modal-overlay').remove()">Cancelar</button><button class="vl-btn vl-btn-p" onclick="vl_guardarCampanha(this)">Criar</button></div></div>`;
            document.body.appendChild(ov);
        }
        async function vl_guardarCampanha(btn) {
            const nome=document.getElementById('nc-nome')?.value.trim(), desc=document.getElementById('nc-desc')?.value.trim();
            const inicio=document.getElementById('nc-inicio')?.value, fim=document.getElementById('nc-fim')?.value;
            const alEl=document.getElementById('nc-alert');
            if(!nome||!inicio||!fim){if(alEl)alEl.innerHTML='<div class="vl-alert vl-alert-e">Preencha nome, início e fim.</div>';return;}
            if(fim<inicio){if(alEl)alEl.innerHTML='<div class="vl-alert vl-alert-e">Data de fim anterior ao início.</div>';return;}
            const slug=nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
            btn.disabled=true; btn.textContent='A criar...';
            try {
                await sb('voluntarios_campanhas',{method:'POST',body:JSON.stringify({nome,descricao:desc||null,data_inicio:inicio,data_fim:fim,slug,status:'rascunho'})});
                btn.closest('.vl-modal-overlay').remove(); vl_renderCampanhas();
            } catch(e) { if(alEl)alEl.innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message||JSON.stringify(e)}</div>`; btn.disabled=false; btn.textContent='Criar'; }
        }
        async function vl_statusCampanha(id, novoStatus) {
            const msgs={ativo:'Ativar campanha?',encerrado:'Encerrar campanha?'};
            if(!confirm(msgs[novoStatus]))return;
            try { await sb(`voluntarios_campanhas?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:novoStatus})}); vl_renderCampanhas(); }
            catch(e){alert('Erro: '+(e?.message||JSON.stringify(e)));}
        }
        async function vl_gerarLinks(campanhaId) {
            const inscIds=await sb(`voluntarios_inscricoes?campanha_id=eq.${campanhaId}&select=id`).catch(()=>[]);
            if(!inscIds.length){alert('Nenhuma inscrição nesta campanha.');return;}
            const ids=inscIds.map(i=>i.id).join(',');
            const atribuicoes=await sb(`voluntarios_atribuicoes?inscricao_id=in.(${ids})&select=id,link_token,ministerio_id,ministerios(nome)`).catch(()=>[]);
            if(!atribuicoes.length){alert('Nenhuma atribuição encontrada. Distribua primeiro as inscrições.');return;}
            const porMin={};
            atribuicoes.forEach(a=>{if(!porMin[a.ministerio_id])porMin[a.ministerio_id]={nome:a.ministerios?.nome,token:a.link_token};});
            const base=`${location.origin}/voluntarios-lider.html`;
            const ov=document.createElement('div'); ov.className='vl-modal-overlay';
            ov.innerHTML=`<div class="vl-modal" style="max-width:540px"><div class="vl-modal-title">Links por Ministério</div>${Object.entries(porMin).map(([,info])=>`<div style="margin-bottom:10px"><div class="vl-label">${info.nome}</div><div class="vl-link-box"><code>${base}?t=${info.token}</code><button class="vl-btn vl-btn-m" style="padding:3px 9px;font-size:8px" onclick="navigator.clipboard.writeText('${base}?t=${info.token}');this.textContent='Copiado!'">Copiar</button></div></div>`).join('')}<div class="vl-modal-footer"><button class="vl-btn vl-btn-p" onclick="this.closest('.vl-modal-overlay').remove()">Fechar</button></div></div>`;
            document.body.appendChild(ov);
        }

        async function vl_filtrarPresencas() {
            const eS=document.getElementById('pr-start'),eE=document.getElementById('pr-end');
            const eM=document.getElementById('pr-min'),eT=document.getElementById('pr-status');
            const eMb=document.getElementById('pr-membro'),eCu=document.getElementById('pr-culto');
            if(eS)_pr_start=eS.value; if(eE)_pr_end=eE.value; if(eM)_pr_min=eM.value;
            if(eT)_pr_status=eT.value; if(eMb)_pr_membro=eMb.value.toLowerCase().trim(); if(eCu)_pr_culto=eCu.value;

            const contentEl=document.getElementById('pr-content');
            if(contentEl)contentEl.innerHTML='<div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar...</div>';
            if(!_pr_start||!_pr_end){if(contentEl)contentEl.innerHTML='<div class="vl-alert vl-alert-e">Seleciona o período.</div>';return;}

            try {
                /* ✦ join cultos com campus ✦ */
                let escPath=`ministerio_escala?data=gte.${_pr_start}&data=lte.${_pr_end}&select=id,membro_id,ministerio_id,culto_id,data,membros(id,nome),ministerios(id,nome),cultos(id,nome,hora_inicio,campus(id,nome))&order=data,culto_id`;
                if(_pr_min)escPath+=`&ministerio_id=eq.${_pr_min}`;
                if(_pr_culto)escPath+=`&culto_id=eq.${_pr_culto}`;

                let ciPath=`ministerio_checkin?data=gte.${_pr_start}&data=lte.${_pr_end}&select=*,membros(id,nome),ministerios(id,nome),cultos(id,nome,hora_inicio,campus(id,nome))&order=data,hora_checkin`;
                if(_pr_min)ciPath+=`&ministerio_id=eq.${_pr_min}`;
                if(_pr_status)ciPath+=`&status=eq.${_pr_status}`;
                if(_pr_culto)ciPath+=`&culto_id=eq.${_pr_culto}`;

                const [esc,ci]=await Promise.all([sb(escPath).catch(()=>[]),sb(ciPath).catch(()=>[])]);
                _pr_escalas=esc||[]; _pr_checkins=ci||[];
                vl_renderPresencasConteudo();
            } catch(e) { if(contentEl)contentEl.innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message}</div>`; }
        }

        function vl_limparFiltrosPr() {
            const {start,end}=mesAtualISO();
            _pr_start=start; _pr_end=end; _pr_min=''; _pr_status=''; _pr_membro=''; _pr_culto='';
            ['pr-start','pr-end','pr-min','pr-status','pr-membro','pr-culto'].forEach(id=>{
                const el=document.getElementById(id); if(!el)return;
                if(id==='pr-start')el.value=start; else if(id==='pr-end')el.value=end; else el.value='';
            });
            /* Ao limpar mostra placeholder novamente */
            const contentEl=document.getElementById('pr-content');
            if(contentEl) contentEl.innerHTML='<div class="pr-placeholder"><div class="pr-placeholder-icon">⟳</div><div>Define o período e clica em <strong>Filtrar</strong> para carregar as presenças.</div></div>';
            const statsEl=document.getElementById('pr-stats'); if(statsEl)statsEl.innerHTML='';
        }

        function vl_renderPresencasConteudo() {
            const contentEl=document.getElementById('pr-content'), statsEl=document.getElementById('pr-stats');
            if(!contentEl)return;

            const ciMap={};
            _pr_checkins.forEach(ci=>{
                const k=`${ci.membro_id}_${ci.ministerio_id}_${ci.culto_id}_${ci.data}`;
                ciMap[k]=ci;
            });

            let linhas=_pr_escalas.map(e=>{
                const k=`${e.membro_id}_${e.ministerio_id}_${e.culto_id}_${e.data}`;
                const ci=ciMap[k];
                return {membro_id:e.membro_id,membro_nome:e.membros?.nome||'—',ministerio_id:e.ministerio_id,ministerio_nome:e.ministerios?.nome||'—',culto_id:e.culto_id,culto_nome:e.cultos?.nome||'—',culto_hora:e.cultos?.hora_inicio?.slice(0,5)||'',culto_campus:e.cultos?.campus?.nome||'',data:e.data,status:ci?.status||'sem_registo',hora_checkin:ci?.hora_checkin||null,minutos_atraso:ci?.minutos_atraso||0};
            });

            const escalasKeys=new Set(_pr_escalas.map(e=>`${e.membro_id}_${e.ministerio_id}_${e.culto_id}_${e.data}`));
            _pr_checkins.forEach(ci=>{
                const k=`${ci.membro_id}_${ci.ministerio_id}_${ci.culto_id}_${ci.data}`;
                if(!escalasKeys.has(k)) linhas.push({membro_id:ci.membro_id,membro_nome:ci.membros?.nome||'—',ministerio_id:ci.ministerio_id,ministerio_nome:ci.ministerios?.nome||'—',culto_id:ci.culto_id,culto_nome:ci.cultos?.nome||'—',culto_hora:ci.cultos?.hora_inicio?.slice(0,5)||'',culto_campus:ci.cultos?.campus?.nome||'',data:ci.data,status:ci.status,hora_checkin:ci.hora_checkin||null,minutos_atraso:ci.minutos_atraso||0});
            });

            if(_pr_membro)linhas=linhas.filter(l=>l.membro_nome.toLowerCase().includes(_pr_membro));
            if(_pr_status)linhas=linhas.filter(l=>l.status===_pr_status);

            if(!linhas.length){
                if(statsEl)statsEl.innerHTML='';
                contentEl.innerHTML='<div class="vl-empty"><div class="vl-empty-icon">—</div>Nenhum registo encontrado com os filtros selecionados.</div>';
                return;
            }

            const totPresente=linhas.filter(l=>l.status==='presente').length, totAtrasado=linhas.filter(l=>l.status==='atrasado').length;
            const totFaltou=linhas.filter(l=>l.status==='faltou').length, totSemReg=linhas.filter(l=>l.status==='sem_registo').length, totConfirm=linhas.filter(l=>l.status==='pre_confirmado').length;

            if(statsEl) statsEl.innerHTML=`
<div class="vl-stat-row" style="margin-bottom:14px">
  <div class="vl-stat"><div class="vl-stat-num">${linhas.length}</div><div class="vl-stat-label">Registos</div></div>
  <div class="vl-stat"><div class="vl-stat-num">${totPresente}</div><div class="vl-stat-label">Presentes</div></div>
  <div class="vl-stat"><div class="vl-stat-num">${totAtrasado}</div><div class="vl-stat-label">Atrasados</div></div>
  <div class="vl-stat"><div class="vl-stat-num">${totFaltou}</div><div class="vl-stat-label">Faltas</div></div>
  <div class="vl-stat"><div class="vl-stat-num">${totConfirm}</div><div class="vl-stat-label">Confirmados</div></div>
  <div class="vl-stat"><div class="vl-stat-num">${totSemReg}</div><div class="vl-stat-label">Sem Registo</div></div>
</div>`;

            const contagemMensal={}, membroAreas={};
            linhas.forEach(l=>{
                if(l.status==='presente'||l.status==='atrasado'){const k=`${l.membro_id}_${l.data.slice(0,7)}`;contagemMensal[k]=(contagemMensal[k]||0)+1;}
                if(!membroAreas[l.membro_id])membroAreas[l.membro_id]=new Set();
                membroAreas[l.membro_id].add(l.ministerio_id);
            });

            /* Agrupar: mês > dia > culto > área */
            const porMes={};
            linhas.forEach(l=>{
                const mes=l.data.slice(0,7);
                if(!porMes[mes])porMes[mes]={};
                const diaKey=l.data;
                if(!porMes[mes][diaKey])porMes[mes][diaKey]={};
                const cultoKey=`${l.culto_id}__${l.culto_nome}__${l.culto_hora}__${l.culto_campus}`;
                if(!porMes[mes][diaKey][cultoKey])porMes[mes][diaKey][cultoKey]={culto_nome:l.culto_nome,culto_hora:l.culto_hora,culto_campus:l.culto_campus,areas:{}};
                const areaKey=l.ministerio_id;
                if(!porMes[mes][diaKey][cultoKey].areas[areaKey])porMes[mes][diaKey][cultoKey].areas[areaKey]={area_nome:l.ministerio_nome,linhas:[]};
                porMes[mes][diaKey][cultoKey].areas[areaKey].linhas.push(l);
            });

            let html='';
            Object.keys(porMes).sort().forEach(mes=>{
                const diasObj=porMes[mes], mesLinhas=linhas.filter(l=>l.data.slice(0,7)===mes);
                const mP=mesLinhas.filter(l=>l.status==='presente').length, mA=mesLinhas.filter(l=>l.status==='atrasado').length;
                const mF=mesLinhas.filter(l=>l.status==='faltou').length, mS=mesLinhas.filter(l=>l.status==='sem_registo').length;
                let diasHtml='';
                Object.keys(diasObj).sort().forEach(dia=>{
                    const cultosObj=diasObj[dia];
                    let cultosHtml='';
                    Object.keys(cultosObj).sort().forEach(cultoKey=>{
                        const cultoBlk=cultosObj[cultoKey];
                        const cultoLinhas=Object.values(cultoBlk.areas).flatMap(a=>a.linhas);
                        const cP=cultoLinhas.filter(l=>l.status==='presente').length, cA=cultoLinhas.filter(l=>l.status==='atrasado').length;
                        const cF=cultoLinhas.filter(l=>l.status==='faltou').length, cS=cultoLinhas.filter(l=>l.status==='sem_registo').length;
                        /* ✦ label com campus ✦ */
                        const campusTag=cultoBlk.culto_campus?`<span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--primary);font-family:var(--font-title);margin-right:6px">${cultoBlk.culto_campus}</span>`:'';
                        let areasHtml='';
                        Object.keys(cultoBlk.areas).sort((a,b)=>cultoBlk.areas[a].area_nome.localeCompare(cultoBlk.areas[b].area_nome)).forEach(areaKey=>{
                            const area=cultoBlk.areas[areaKey];
                            const aP=area.linhas.filter(l=>l.status==='presente'||l.status==='atrasado').length;
                            const aF=area.linhas.filter(l=>l.status==='faltou').length;
                            const rows=area.linhas.map(l=>{
                                const vezes=contagemMensal[`${l.membro_id}_${l.data.slice(0,7)}`]||0;
                                const multiArea=(membroAreas[l.membro_id]?.size||0)>1;
                                const horaLabel=l.hora_checkin?l.hora_checkin.slice(0,5):'—';
                                const tardLabel=l.status==='atrasado'&&l.minutos_atraso>0?` +${l.minutos_atraso}min`:'';
                                return `<tr><td style="font-size:12px;font-weight:600">${l.membro_nome}</td><td><span class="vl-badge vl-b-${l.status}">${st_label(l.status)}${tardLabel}</span></td><td style="font-size:11px">${horaLabel}</td><td style="font-size:11px;text-align:center">${vezes>0?vezes+'x':'—'}</td><td>${multiArea?'<span class="pr-multi-tag">+1 área</span>':''}</td></tr>`;
                            }).join('');
                            areasHtml+=`<div style="margin:0;border-top:1px solid var(--border)"><div style="display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--bg-page)"><div style="font-family:var(--font-title);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-dark)">${area.area_nome}</div><span style="font-size:9px;color:var(--text-faint)">${area.linhas.length} escalados</span>${aP?`<span class="pr-stat-pill" style="background:#15803d">${aP} pres.</span>`:''} ${aF?`<span class="pr-stat-pill" style="background:#b91c1c">${aF} faltas</span>`:''}</div><table class="vl-table" style="font-size:11px"><thead><tr><th>Voluntário</th><th>Estado</th><th>Chegada</th><th>Vezes/Mês</th><th>Multi-área</th></tr></thead><tbody>${rows}</tbody></table></div>`;
                        });
                        cultosHtml+=`<div style="border-top:2px solid var(--primary-faint)"><div style="display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--bg-input)">${campusTag}<div style="font-family:var(--font-title);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-main)">${cultoBlk.culto_nome}${cultoBlk.culto_hora?' · '+cultoBlk.culto_hora:''}</div><span style="font-size:10px;color:var(--text-faint)">${cultoLinhas.length} vol.</span>${cP?`<span class="pr-stat-pill" style="background:#15803d">${cP} pres.</span>`:''} ${cA?`<span class="pr-stat-pill" style="background:#b45309">${cA} atras.</span>`:''} ${cF?`<span class="pr-stat-pill" style="background:#b91c1c">${cF} faltas</span>`:''} ${cS?`<span class="pr-stat-pill" style="background:#6b7280">${cS} sem reg.</span>`:''}</div>${areasHtml}</div>`;
                    });
                    diasHtml+=`<div style="border-top:1px solid var(--border)"><div style="padding:8px 14px;background:var(--bg-card)"><span style="font-family:var(--font-title);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-dark)">${fmtDataExtensa(dia)}</span></div>${cultosHtml}</div>`;
                });
                html+=`<div class="pr-month-block"><div class="pr-month-hd"><div class="pr-month-nome">${fmtMes(mes)}</div><div class="pr-month-stats">${mP?`<span class="pr-stat-pill" style="background:#15803d">${mP} presentes</span>`:''} ${mA?`<span class="pr-stat-pill" style="background:#b45309">${mA} atrasados</span>`:''} ${mF?`<span class="pr-stat-pill" style="background:#b91c1c">${mF} faltas</span>`:''} ${mS?`<span class="pr-stat-pill" style="background:#6b7280">${mS} sem registo</span>`:''}</div></div>${diasHtml}</div>`;
            });
            contentEl.innerHTML=html;
        }

        function st_label(status){return{presente:'Presente',atrasado:'Atrasado',faltou:'Falta',pre_confirmado:'Confirmado',sem_registo:'Sem registo'}[status]||status;}

        function vl_imprimirPresencas() {
            const contentEl=document.getElementById('pr-content'); if(!contentEl)return;
            const minNome=_pr_min?(_pr_mins_list.find(m=>m.id===_pr_min)?.nome||''):'Todos os ministérios';
            const periodoLabel=`${fmtD(_pr_start)} a ${fmtD(_pr_end)}`;
            let bodyHtml=`<h2>Relatório de Presenças</h2><p style="font-size:10px;color:#555;margin-bottom:4px">Período: <strong>${periodoLabel}</strong> | Área: <strong>${minNome}</strong></p><p style="font-size:10px;color:#555;margin-bottom:14px">Exportado em ${new Date().toLocaleString('pt-PT')}</p>`;
            document.querySelectorAll('#pr-content .pr-month-block').forEach(monthEl=>{
                const mNome=monthEl.querySelector('.pr-month-nome')?.textContent||'';
                const mStats=monthEl.querySelector('.pr-month-stats')?.textContent?.replace(/\s+/g,' ').trim()||'';
                bodyHtml+=`<h3 style="font-size:12px;margin:14px 0 4px;border-bottom:1px solid #ccc;padding-bottom:4px">${mNome} — ${mStats}</h3>`;
                monthEl.querySelectorAll('tbody tr').forEach(tr=>{
                    const tds=tr.querySelectorAll('td');
                    if(!bodyHtml.includes('<table>'))bodyHtml+='<table><thead><tr><th>Voluntário</th><th>Estado</th><th>Chegada</th><th>Vezes/Mês</th><th>Multi-área</th></tr></thead><tbody>';
                    bodyHtml+=`<tr>${[...tds].map(td=>`<td>${td.textContent?.trim()||''}</td>`).join('')}</tr>`;
                });
                if(bodyHtml.includes('<tbody>'))bodyHtml+='</tbody></table>';
            });
            abrirJanelaPrint(bodyHtml);
        }

        /* ══════════════════════════════════════════
           ABA 5 — RELATÓRIO DE CULTO
        ══════════════════════════════════════════ */
        let _rel_cultos_list=[], _rel_data='', _rel_culto_id='';

        async function vl_renderRelatorio() {
            c().innerHTML='<div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar cultos...</div>';
            try {
                /* ✦ cultos com campus ✦ */
                _rel_cultos_list=await sb('cultos?ativo=eq.true&select=id,nome,hora_inicio,campus(id,nome)&order=hora_inicio')||[];
            } catch(_){}
            if (!_rel_data) _rel_data=new Date().toISOString().slice(0,10);

            const cultoOpts=_rel_cultos_list.map(cu=>
                `<option value="${cu.id}" ${cu.id===_rel_culto_id?'selected':''}>${cultoLabelText(cu)}</option>`
            ).join('');

            c().innerHTML=`
<div class="vl-toolbar">
  <span class="vl-toolbar-title">Relatório de Culto</span>
</div>
<div class="vl-card" style="margin-bottom:14px">
  <div class="vl-card-title">Selecionar Culto</div>
  <div class="vl-row">
    <div class="vl-field"><label class="vl-label">Data</label><input type="date" class="vl-input" id="rel-data" value="${_rel_data}"></div>
    <div class="vl-field" style="flex:2"><label class="vl-label">Culto</label><select class="vl-select" id="rel-culto"><option value="">Selecionar culto...</option>${cultoOpts}</select></div>
    <div style="display:flex;align-items:flex-end"><button class="vl-btn vl-btn-p" onclick="vl_carregarRelatorio()">Carregar</button></div>
  </div>
</div>
<div id="rel-content"></div>`;
            if(_rel_data&&_rel_culto_id)await vl_carregarRelatorio(true);
        }

        async function vl_carregarRelatorio(silente) {
            const eD=document.getElementById('rel-data'), eCu=document.getElementById('rel-culto');
            if(eD)_rel_data=eD.value; if(eCu)_rel_culto_id=eCu.value;
            const el=document.getElementById('rel-content'); if(!el)return;
            if(!_rel_data||!_rel_culto_id){el.innerHTML='<div class="vl-alert vl-alert-e">Seleciona data e culto.</div>';return;}
            if(!silente)el.innerHTML='<div class="vl-empty"><div class="vl-empty-icon">—</div>A carregar...</div>';

            const culto=_rel_cultos_list.find(cu=>cu.id===_rel_culto_id);
            /* ✦ label com campus ✦ */
            const cLabel=culto?cultoLabelText(culto):'—';

            let dadosGuardados=null, volCount=0, volPresentes=[], relId=null;
            try {
                const [relRows,escRows,ciRows]=await Promise.all([
                    sb(`cultos_relatorio_geral?data=eq.${_rel_data}&culto_id=eq.${_rel_culto_id}&select=*&limit=1`).catch(()=>[]),
                    sb(`ministerio_escala?data=eq.${_rel_data}&culto_id=eq.${_rel_culto_id}&select=membro_id,ministerio_id,membros(id,nome,foto_url),ministerios(nome)&order=ministerios(nome),membros(nome)`).catch(()=>[]),
                    sb(`ministerio_checkin?data=eq.${_rel_data}&culto_id=eq.${_rel_culto_id}&select=membro_id,ministerio_id,status,hora_checkin,minutos_atraso,membros(nome),ministerios(nome)`).catch(()=>[]),
                ]);
                dadosGuardados=relRows?.[0]||null; relId=dadosGuardados?.id||null; volCount=escRows.length;
                const ciByMembro={};
                (ciRows||[]).forEach(ci=>{ciByMembro[`${ci.membro_id}_${ci.ministerio_id}`]=ci;});
                volPresentes=(escRows||[]).map(e=>{const ci=ciByMembro[`${e.membro_id}_${e.ministerio_id}`];return{nome:e.membros?.nome||'—',foto:e.membros?.foto_url||null,area:e.ministerios?.nome||'—',status:ci?.status||'sem_registo',hora_checkin:ci?.hora_checkin?.slice(0,5)||'—',minutos_atraso:ci?.minutos_atraso||0};});
            } catch(_){}

            const d=dadosGuardados||{};
            const val=(f,def='')=>d[f]!=null?d[f]:def;
            const camposManual=[
                {id:'total_participantes',label:'Total de Participantes'},{id:'total_templo',label:'Total no Templo'},
                {id:'total_overflow',label:'Total no Overflow'},{id:'bercario',label:'Berçário'},
                {id:'keola',label:'Keola'},{id:'traducao',label:'Tradução'},{id:'streaming',label:'Streaming (PT)'},
                {id:'streaming_en',label:'Streaming (EN)'},{id:'salvacoes',label:'Salvações'},
                {id:'curas',label:'Curas'},{id:'visitantes',label:'Visitantes'},
                {id:'tempo_oferta',label:'Tempo Oferta',tipo:'text',placeholder:'Ex: 2:46'},
            ];
            const camposHtml=camposManual.map(f=>`<div class="vl-field"><label class="vl-label">${f.label}</label><input type="${f.tipo||'number'}" min="0" class="vl-input" id="rel-${f.id}" value="${val(f.id)}" placeholder="${f.placeholder||'0'}"></div>`).join('');
            const volRows=volPresentes.map(v=>{const tard=v.status==='atrasado'&&v.minutos_atraso>0?` +${v.minutos_atraso}min`:'';return `<tr><td style="font-size:12px">${v.nome}</td><td style="font-size:11px;color:var(--text-faint)">${v.area}</td><td><span class="vl-badge vl-b-${v.status}">${st_label(v.status)}${tard}</span></td><td style="font-size:11px">${v.hora_checkin}</td></tr>`;}).join('');

            el.innerHTML=`
<div class="vl-card" style="margin-bottom:12px">
  <div class="vl-card-title">${cLabel} — ${fmtD(_rel_data)}</div>
  <div style="background:var(--primary-faint);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px">
    <div style="font-family:var(--font-title);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-dark)">Voluntários na Escala</div>
    <div style="font-family:var(--font-title);font-size:20px;font-weight:700;color:var(--primary-dark)" id="rel-vol-auto">${volCount}</div>
    <div style="font-size:10px;color:var(--text-faint)">(calculado automaticamente das escalas)</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px">${camposHtml}</div>
  <div id="rel-alert" style="margin-top:10px"></div>
  <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
    <button class="vl-btn vl-btn-m" onclick="vl_relGerarPDF(${JSON.stringify(volPresentes).replace(/"/g,'&quot;')})">Gerar PDF</button>
    <button class="vl-btn vl-btn-p" onclick="vl_relGuardar('${relId||''}',${volCount})">Guardar</button>
  </div>
</div>
<div class="vl-card" style="padding:0;overflow:hidden">
  <div class="vl-card-title" style="padding:12px 14px">Voluntários Escalados (${volCount})</div>
  ${volCount?`<table class="vl-table"><thead><tr><th>Nome</th><th>Área</th><th>Estado</th><th>Chegada</th></tr></thead><tbody>${volRows}</tbody></table>`:'<div class="vl-empty" style="padding:24px">Nenhum voluntário escalado para este culto.</div>'}
</div>`;
        }

        async function vl_relGuardar(relId, volCount) {
            const alEl=document.getElementById('rel-alert');
            const campos=['total_participantes','total_templo','total_overflow','bercario','keola','traducao','streaming','streaming_en','salvacoes','curas','visitantes','tempo_oferta'];
            const payload={data:_rel_data,culto_id:_rel_culto_id,voluntarios:volCount};
            campos.forEach(f=>{ const el=document.getElementById(`rel-${f}`); if(!el)return; const v=el.value.trim(); payload[f]=f==='tempo_oferta'?(v||null):(v!==''?Number(v):null); });
            try {
                if(relId){await sb(`cultos_relatorio_geral?id=eq.${relId}`,{method:'PATCH',body:JSON.stringify(payload)});}
                else{await sb('cultos_relatorio_geral',{method:'POST',body:JSON.stringify(payload)});}
                if(alEl){alEl.innerHTML='<div class="vl-alert vl-alert-s">Guardado com sucesso.</div>';setTimeout(()=>alEl.innerHTML='',3000);}
                await vl_carregarRelatorio(true);
            } catch(e) { if(alEl)alEl.innerHTML=`<div class="vl-alert vl-alert-e">Erro: ${e?.message}</div>`; }
        }

        function vl_relGerarPDF(volPresentes) {
            const culto=_rel_cultos_list.find(cu=>cu.id===_rel_culto_id);
            const cLabel=culto?cultoLabelText(culto):'—';
            const campos=[{id:'total_participantes',label:'Total de Participantes'},{id:'total_templo',label:'Total no Templo'},{id:'total_overflow',label:'Total no Overflow'},{id:'bercario',label:'Berçário'},{id:'keola',label:'Keola'},{id:'voluntarios',label:'Voluntários',auto:true},{id:'traducao',label:'Tradução'},{id:'streaming',label:'Streaming (PT)'},{id:'streaming_en',label:'Streaming (EN)'},{id:'salvacoes',label:'Salvações'},{id:'curas',label:'Curas'},{id:'visitantes',label:'Visitantes'},{id:'tempo_oferta',label:'Tempo Oferta'}];
            const valores={};
            campos.forEach(f=>{
                if(f.auto){const autoEl=document.getElementById('rel-vol-auto');valores[f.id]=autoEl?autoEl.textContent.trim():'—';}
                else{const el=document.getElementById(`rel-${f.id}`);valores[f.id]=el?(el.value||'—'):'—';}
            });
            const barDados=[{label:'Particip.',val:parseInt(valores.total_participantes)||0,cor:'#0e7490'},{label:'Templo',val:parseInt(valores.total_templo)||0,cor:'#0891b2'},{label:'Overflow',val:parseInt(valores.total_overflow)||0,cor:'#06b6d4'},{label:'Salvações',val:parseInt(valores.salvacoes)||0,cor:'#15803d'},{label:'Visitantes',val:parseInt(valores.visitantes)||0,cor:'#b45309'},{label:'Vols.',val:parseInt(valores.voluntarios)||0,cor:'#7c3aed'}];
            const maxVal=Math.max(...barDados.map(d=>d.val),1), barW=60, barGap=18, svgW=barDados.length*(barW+barGap)+barGap, svgH=180;
            const barsSvg=barDados.map((d,i)=>{const h=Math.round((d.val/maxVal)*120),x=barGap+i*(barW+barGap),y=130-h;return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${d.cor}" rx="4"/><text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">${d.val||'—'}</text><text x="${x+barW/2}" y="155" text-anchor="middle" font-size="10" fill="#444">${d.label}</text>`;}).join('');
            const volRows=(volPresentes||[]).map(v=>{
                const tard=v.status==='atrasado'&&v.minutos_atraso>0?` +${v.minutos_atraso}min`:'';
                const statusColors={presente:'#15803d',atrasado:'#b45309',faltou:'#b91c1c',pre_confirmado:'#0e7490',sem_registo:'#6b7280'};
                const cor=statusColors[v.status]||'#6b7280';
                const ini=v.nome.split(' ').slice(0,2).map(p=>p[0]||'').join('').toUpperCase();
                const fotoHtml=v.foto?`<img src="${v.foto}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #ddd;display:block;margin:auto">`:`<div style="width:32px;height:32px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#374151;margin:auto">${ini}</div>`;
                return `<tr><td style="text-align:center">${fotoHtml}</td><td>${v.nome}</td><td>${v.area}</td><td style="color:${cor};font-weight:600">${st_label(v.status)}${tard}</td><td>${v.hora_checkin}</td></tr>`;
            }).join('');
            abrirJanelaPrint(`<h2>${cLabel}</h2><p style="font-size:10px;color:#666;margin:0 0 16px">${fmtD(_rel_data)} | Gerado em ${new Date().toLocaleString('pt-PT')}</p><table style="width:100%;border-collapse:collapse;margin-bottom:18px"><thead><tr><th>Indicador</th><th>Valor</th></tr></thead><tbody>${campos.map(f=>`<tr><td>${f.label}</td><td><strong>${valores[f.id]||'—'}</strong></td></tr>`).join('')}</tbody></table><h3 style="font-size:12px;margin:0 0 8px">Indicadores Principais</h3><svg width="${svgW}" height="${svgH}" style="display:block;margin-bottom:18px">${barsSvg}</svg><h3 style="font-size:12px;margin:0 0 6px;border-top:1px solid #ccc;padding-top:10px">Voluntários Escalados (${(volPresentes||[]).length})</h3><table><thead><tr><th>Foto</th><th>Nome</th><th>Área</th><th>Estado</th><th>Chegada</th></tr></thead><tbody>${volRows}</tbody></table>`);
        }

        /* ══ MISC ══ */
        function vl_toggle(id) {
            const row=document.getElementById(`vl-det-${id}`); if(!row)return;
            row.classList.toggle('vl-hidden');
            const btn=document.querySelector(`#vl-row-${id} button`); if(btn)btn.textContent=row.classList.contains('vl-hidden')?'+':'−';
        }
        function vl_filtrarCampanha(id) { vl_campFiltro=id||null; vl_renderInscricoes(); }
        async function vl_verificarPrazos() {
            try {
                const agora=new Date().toISOString();
                const exp=await sb(`voluntarios_atribuicoes?status=eq.aguardando&prazo_contato=lt.${agora}&select=id,inscricao_id`).catch(()=>[]);
                for (const a of exp) {
                    await sb(`voluntarios_atribuicoes?id=eq.${a.id}`,{method:'PATCH',body:JSON.stringify({status:'sem_retorno'})});
                    await sb(`voluntarios_inscricoes?id=eq.${a.inscricao_id}`,{method:'PATCH',body:JSON.stringify({status:'sem_retorno'})});
                }
            } catch(_){}
        }

        /* ══ EXPOR NO WINDOW ══ */
        window.vl_init=vl_init; window.vl_setTab=vl_setTab; window.vl_toggle=vl_toggle;
        window.vl_filtrarCampanha=vl_filtrarCampanha; window.vl_aprovar=vl_aprovar;
        window.vl_distribuirTodos=vl_distribuirTodos; window.vl_filtrarInscricoes=vl_filtrarInscricoes;
        window.vl_limparFiltrosIns=vl_limparFiltrosIns; window.vl_mostrarLinkLider=vl_mostrarLinkLider;
        window.vl_abrirDistribuir=vl_abrirDistribuir; window.vl_confirmarDistribuir=vl_confirmarDistribuir;
        window.vl_abrirRegistarVoluntario=vl_abrirRegistarVoluntario; window.vl_confirmarRegistar=vl_confirmarRegistar;
        window.vl_novaCampanha=vl_novaCampanha; window.vl_guardarCampanha=vl_guardarCampanha;
        window.vl_statusCampanha=vl_statusCampanha; window.vl_gerarLinks=vl_gerarLinks;
        window.vl_renderAtivosFiltrado=vl_renderAtivosFiltrado; window.vl_limparFiltros=vl_limparFiltros;
        window.vl_removerVoluntario=vl_removerVoluntario; window.vl_abrirPerfil=vl_abrirPerfil;
        window.vl_mostrarTabPerfil=vl_mostrarTabPerfil; window.vl_carregarAnotacoes=vl_carregarAnotacoes;
        window.vl_salvarAnotacao=vl_salvarAnotacao; window.vl_removerMinisterioModal=vl_removerMinisterioModal;
        window.vl_adicionarMinisterioModal=vl_adicionarMinisterioModal; window.vl_removerVoluntarioModal=vl_removerVoluntarioModal;
        window.vl_guardarFuncao=vl_guardarFuncao; window.vl_abrirRejeitar=vl_abrirRejeitar;
        window.vl_confirmarRejeitar=vl_confirmarRejeitar; window.vl_filtrarPresencas=vl_filtrarPresencas;
        window.vl_limparFiltrosPr=vl_limparFiltrosPr; window.vl_imprimirAtivos=vl_imprimirAtivos;
        window.vl_imprimirPresencas=vl_imprimirPresencas; window.vl_renderRelatorio=vl_renderRelatorio;
        window.vl_carregarRelatorio=vl_carregarRelatorio; window.vl_relGuardar=vl_relGuardar;
        window.vl_relGerarPDF=vl_relGerarPDF; window.vl_selecionarMembroReg=vl_selecionarMembroReg;
        window.vl_limparSelecaoReg=vl_limparSelecaoReg;

        vl_init();
    })();
</script>
