<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Serviços da Comunidade — Zion Church Lisboa</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#009098">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zion Lisboa">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* ── Hero banner ─────────────────────────────────── */
    .banner {
      min-height: 28vh !important;
      background-image: url('https://images.unsplash.com/photo-1556761175-5973dc0f32e7?w=1200&q=80') !important;
      background-size: cover !important;
      background-position: center 40% !important;
      align-items: flex-end !important;
      justify-content: space-between !important;
      display: flex !important;
      padding: 0 14px 14px !important;
      overflow: hidden !important;
      position: relative;
    }
    .banner-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.52);
    }
    .banner-gradient {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 120px;
      background: linear-gradient(to bottom, rgba(2,22,30,0), rgba(2,22,30,1));
    }

    /* ── Nav pills ───────────────────────────────────── */
    .back-btn {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 6px;
      background: rgba(2,22,30,0.65);
      border: 1px solid rgba(216,195,165,0.35);
      border-radius: 999px; padding: 6px 14px;
      font-family: var(--font-title); font-size: 10px; letter-spacing: 1.5px;
      color: var(--primary); text-decoration: none;
      backdrop-filter: blur(8px); transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(216,195,165,0.12); border-color: var(--primary-light); color: var(--primary-light); }
    .page-badge {
      position: relative; z-index: 2;
      font-family: var(--font-title); font-size: 10px; letter-spacing: 2px;
      color: var(--primary); text-transform: uppercase;
      background: rgba(2,22,30,0.65); border: 1px solid rgba(216,195,165,0.35);
      border-radius: 999px; padding: 6px 14px; backdrop-filter: blur(8px);
    }

    /* ── Content ─────────────────────────────────────── */
    .content {
      flex: 1; overflow-y: auto;
      padding: 20px 18px 24px;
      background: var(--bg-input);
    }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: rgba(0,144,152,0.25); border-radius: 2px; }

    /* ── Intro / aviso card ──────────────────────────── */
    .intro-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 18px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm); animation: fadeUp 0.3s ease both;
    }
    .intro-card .card-text { font-size: 14px; color: var(--text-muted); line-height: 1.75; }

    .contact-banner {
      background: rgba(0,144,152,0.07);
      border: 1px solid rgba(0,144,152,0.25);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px;
      animation: fadeUp 0.35s ease both;
    }
    .contact-banner-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      background: rgba(0,144,152,0.15); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .contact-banner-icon svg { width: 18px; height: 18px; }
    .contact-banner-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
    .contact-banner-text strong { color: var(--primary-dark); font-weight: 700; }

    /* ── Filtros ─────────────────────────────────────── */
    .filters-wrap {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 18px;
      animation: fadeUp 0.38s ease both;
    }
    .filter-search {
      flex: 1; min-width: 160px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 9px 12px;
      font-size: 13px; font-family: var(--font-body);
      color: #fff; outline: none;
    }
    .filter-search::placeholder { color: rgba(255,255,255,0.3); }
    .filter-search:focus { border-color: var(--primary); }
    .filter-select {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 9px 12px;
      font-size: 12px; font-family: var(--font-body);
      color: rgba(255,255,255,0.7); outline: none; cursor: pointer;
    }
    .filter-select:focus { border-color: var(--primary); }
    .filter-select option { background: #081c26; }
    .filter-count {
      padding: 9px 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: var(--font-title); font-size: 10px; letter-spacing: 1px;
      color: var(--primary-dark); white-space: nowrap;
      display: flex; align-items: center;
    }

    /* ── Card de serviço ─────────────────────────────── */
    .srv-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); margin-bottom: 12px;
      box-shadow: var(--shadow-sm); overflow: hidden;
      animation: fadeUp 0.4s ease both;
      transition: border-color 0.2s;
    }
    .srv-card:hover { border-color: rgba(0,144,152,0.35); }

    /* Topo com imagem opcional */
    .srv-card-top {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 18px 12px;
    }
    .srv-logo {
      width: 52px; height: 52px; flex-shrink: 0;
      border-radius: 12px; object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg-input);
    }
    .srv-logo-ph {
      width: 52px; height: 52px; flex-shrink: 0;
      border-radius: 12px; border: 1px solid var(--border);
      background: rgba(0,144,152,0.12);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title); font-size: 18px; font-weight: 700;
      color: var(--primary);
    }
    .srv-card-body { flex: 1; min-width: 0; }

    .srv-card-badges {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; margin-bottom: 6px;
    }
    .srv-badge-area {
      display: inline-block; padding: 3px 10px;
      border-radius: var(--radius-full);
      font-family: var(--font-title); font-size: 9px; letter-spacing: 1.5px;
      text-transform: uppercase; font-weight: 600;
    }
    .srv-badge-zona {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: var(--radius-full);
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      font-size: 10px; color: rgba(255,255,255,0.45);
    }
    .srv-badge-zona svg { width: 10px; height: 10px; }

    .srv-nome {
      font-family: var(--font-title); font-size: 15px; font-weight: 600;
      color: var(--primary-dark); margin-bottom: 6px; line-height: 1.3;
    }
    .srv-descricao {
      font-size: 13px; color: var(--text-muted); line-height: 1.75;
    }

    /* Links de redes sociais / site */
    .srv-links {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    }
    .srv-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 999px;
      border: 1px solid rgba(0,144,152,0.3);
      background: rgba(0,144,152,0.07);
      font-size: 11px; color: var(--primary);
      text-decoration: none; transition: all 0.15s;
    }
    .srv-link:hover { background: rgba(0,144,152,0.18); border-color: var(--primary); }
    .srv-link svg { width: 12px; height: 12px; }

    /* Faixa de contacto */
    .srv-card-footer {
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      padding: 10px 18px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .srv-contact-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-faint);
    }
    .srv-contact-item svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--primary); }
    .srv-contact-item a { color: var(--primary); text-decoration: none; font-size: 12px; }
    .srv-contact-item a:hover { text-decoration: underline; }
    .srv-contact-name { font-weight: 600; color: var(--text-main); }

    /* ── Cores por área ──────────────────────────────── */
    .area-ti        { background: rgba(0,144,152,0.15); color: var(--primary); border: 1px solid rgba(0,144,152,0.3); }
    .area-saude     { background: rgba(46,125,50,0.15); color: #70d988; border: 1px solid rgba(46,125,50,0.3); }
    .area-educacao  { background: rgba(0,80,180,0.15);  color: #5090e0; border: 1px solid rgba(0,80,180,0.3); }
    .area-comercio  { background: rgba(200,100,0,0.15); color: #ffa040; border: 1px solid rgba(200,100,0,0.3); }
    .area-admin     { background: rgba(130,60,200,0.15);color: #ab73e8; border: 1px solid rgba(130,60,200,0.3); }
    .area-financeiro{ background: rgba(160,130,0,0.15); color: #d4b800; border: 1px solid rgba(160,130,0,0.3); }
    .area-arte      { background: rgba(160,0,80,0.15);  color: #e060a0; border: 1px solid rgba(160,0,80,0.3); }
    .area-servicos  { background: rgba(80,120,0,0.15);  color: #a0c030; border: 1px solid rgba(80,120,0,0.3); }
    .area-construcao{ background: rgba(120,80,30,0.15); color: #c8903c; border: 1px solid rgba(120,80,30,0.3); }
    .area-juridico  { background: rgba(100,0,150,0.15); color: #c080ff; border: 1px solid rgba(100,0,150,0.3); }
    .area-outros    { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.12); }

    /* ── Empty / Loading ─────────────────────────────── */
    .empty { text-align: center; padding: 40px 0; }
    .empty-txt { font-size: 13px; color: var(--text-faint); }

    /* ── Botão flutuante de submissão ── */
    .submit-fab {
      position: fixed; bottom: 80px; right: 18px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      padding: 11px 18px; border-radius: 999px; border: none;
      background: var(--primary); color: #fff;
      font-family: var(--font-title); font-size: 10px; letter-spacing: 1.5px;
      box-shadow: 0 4px 20px rgba(0,144,152,0.4);
      cursor: pointer; transition: all 0.2s;
    }
    .submit-fab:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,144,152,0.5); }
    .submit-fab svg { width: 14px; height: 14px; }

    /* ── Overlay + modal ── */
    .submit-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .submit-overlay.open { opacity: 1; pointer-events: all; }

    .submit-modal {
      width: 100%; max-width: 520px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 0 0 env(safe-area-inset-bottom);
      max-height: 90vh; overflow-y: auto;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    }
    .submit-overlay.open .submit-modal { transform: translateY(0); }
    .submit-modal::-webkit-scrollbar { width: 3px; }
    .submit-modal::-webkit-scrollbar-thumb { background: rgba(0,144,152,0.25); border-radius: 2px; }

    /* Handle de drag */
    .submit-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.15);
      margin: 12px auto 0;
    }

    .submit-modal-head {
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .submit-modal-title { font-family: var(--font-title); font-size: 13px; letter-spacing: 1px; color: #fff; }
    .submit-modal-close {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-input);
      color: rgba(255,255,255,0.5); font-size: 16px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .submit-modal-close:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

    .submit-form { padding: 16px 20px 24px; }

    .submit-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .submit-label {
      font-size: 9px; font-family: var(--font-title); letter-spacing: 1px;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
    }
    .submit-input, .submit-select, .submit-textarea {
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px;
      font-size: 13px; font-family: var(--font-body); color: #fff;
      outline: none; transition: border-color 0.15s; width: 100%;
    }
    .submit-input::placeholder, .submit-textarea::placeholder { color: rgba(255,255,255,0.2); }
    .submit-select option { background: #081c26; color: #fff; }
    .submit-input:focus, .submit-select:focus, .submit-textarea:focus { border-color: var(--primary); }
    .submit-textarea { resize: vertical; min-height: 80px; }

    .submit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .submit-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; line-height: 1.6; }
    .submit-msg.error   { display: block; background: rgba(198,40,40,0.1);  color: #ff7070; border: 1px solid rgba(198,40,40,0.3); }
    .submit-msg.success { display: block; background: rgba(46,125,50,0.1);  color: #70d988; border: 1px solid rgba(46,125,50,0.3); }

    .submit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .submit-btn-cancel {
      padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-input); color: rgba(255,255,255,0.5);
      font-family: var(--font-title); font-size: 9px; letter-spacing: 1px; cursor: pointer;
    }
    .submit-btn-send {
      flex: 1; padding: 10px 18px; border-radius: 8px; border: none;
      background: var(--primary); color: #fff;
      font-family: var(--font-title); font-size: 9px; letter-spacing: 1px; cursor: pointer;
    }
    .submit-btn-send:hover { background: var(--primary-dark); }
    .submit-btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit-notice {
      font-size: 11px; color: rgba(255,255,255,0.3);
      text-align: center; padding-top: 10px; line-height: 1.6;
    }

  </style>
</head>
<body>
<div class="page-wrapper">

  <div class="banner">
    <div class="banner-overlay"></div>
    <div class="banner-gradient"></div>
    <a href="index.html" class="back-btn">← Início</a>
    <span class="page-badge">Serviços da Comunidade</span>
  </div>

  <div class="gold-line"></div>

  <div class="content" id="main-content">
    <div class="loading"><div class="spin"></div>A carregar serviços...</div>
  </div>

  <div class="footer">
    <div class="footer-links" id="footer-links">
      <a class="footer-link" href="https://zionchurch.org.br/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>
        Site Oficial
      </a>
      <a class="footer-link" href="https://www.instagram.com/zionlisboa/" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        @ZionLisboa
      </a>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-bottom">
      <div class="footer-copy" id="footer-copy">© 2026 Zion Lisboa — Todos os direitos reservados</div>
      <div class="footer-address" id="footer-addr">Rua do Centro Cultural, 11 · 1700-036 Alvalade · Lisboa, Portugal</div>
    </div>
  </div>

</div>

<script>
  const SUPA_URL = window.SUPABASE_URL      || '';
  const SUPA_KEY = window.SUPABASE_ANON_KEY || '';

  async function sb(path) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    if (!r.ok) throw new Error(`Supabase ${r.status}`);
    return r.json();
  }

  /* ── Mapeamento área → classe CSS ── */
  const AREA_CLASSE = {
    'Tecnologia/TI':          'area-ti',
    'Saúde':                  'area-saude',
    'Educação':               'area-educacao',
    'Comércio/Vendas':        'area-comercio',
    'Administrativo':         'area-admin',
    'Financeiro/Contabilidade':'area-financeiro',
    'Arte/Design':            'area-arte',
    'Serviços Gerais':        'area-servicos',
    'Construção Civil':       'area-construcao',
    'Jurídico':               'area-juridico',
    'Outros':                 'area-outros',
  };

  /* ── SVG icons ── */
  const SVG_PERSON  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  const SVG_MAIL    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
  const SVG_PHONE   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.6a16 16 0 0 0 6.29 6.29l.89-.89a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
  const SVG_GLOBE   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>`;
  const SVG_IG      = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>`;
  const SVG_PIN     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  const SVG_INFO    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

  /* ── Render um card de serviço ── */
  function renderSrvCard(s, delay) {
    const areaClasse = AREA_CLASSE[s.area_atuacao] || 'area-outros';

    /* Logo ou placeholder com inicial */
    const logoHtml = s.imagem_url
            ? `<img class="srv-logo" src="${s.imagem_url}" alt="${s.nome_empresa}" onerror="this.outerHTML='<div class=\\'srv-logo-ph\\'>${(s.nome_empresa||'?').charAt(0).toUpperCase()}</div>'">`
            : `<div class="srv-logo-ph">${(s.nome_empresa||'?').charAt(0).toUpperCase()}</div>`;

    /* Links externos */
    const links = [];
    if (s.website)   links.push(`<a class="srv-link" href="${s.website}" target="_blank">${SVG_GLOBE} Website</a>`);
    if (s.instagram) links.push(`<a class="srv-link" href="${s.instagram}" target="_blank">${SVG_IG} Instagram</a>`);

    /* Contactos rodapé */
    const contactos = [];
    if (s.nome_contato)      contactos.push(`<span class="srv-contact-item">${SVG_PERSON}<span class="srv-contact-name">${s.nome_contato}</span></span>`);
    if (s.email_contato)     contactos.push(`<span class="srv-contact-item">${SVG_MAIL}<a href="mailto:${s.email_contato}">${s.email_contato}</a></span>`);
    if (s.telemovel_contato) contactos.push(`<span class="srv-contact-item">${SVG_PHONE}<a href="tel:${s.telemovel_contato}">${s.telemovel_contato}</a></span>`);

    return `
        <div class="srv-card" style="animation-delay:${delay}s">
            <div class="srv-card-top">
                ${logoHtml}
                <div class="srv-card-body">
                    <div class="srv-card-badges">
                        <span class="srv-badge-area ${areaClasse}">${s.area_atuacao}</span>
                        ${s.zona_atuacao ? `<span class="srv-badge-zona">${SVG_PIN} ${s.zona_atuacao}</span>` : ''}
                    </div>
                    <div class="srv-nome">${s.nome_empresa}</div>
                    ${s.descricao ? `<div class="srv-descricao">${s.descricao}</div>` : ''}
                    ${links.length ? `<div class="srv-links">${links.join('')}</div>` : ''}
                </div>
            </div>
            ${contactos.length ? `<div class="srv-card-footer">${contactos.join('')}</div>` : ''}
        </div>`;
  }

  /* ── Estado dos filtros ── */
  let servicosOriginais = [];
  let filtroTexto = '';
  let filtroArea  = '';

  function renderLista() {
    const lista = servicosOriginais.filter(s => {
      const t = filtroTexto.toLowerCase();
      if (t && !s.nome_empresa.toLowerCase().includes(t) &&
              !(s.descricao||'').toLowerCase().includes(t) &&
              !(s.zona_atuacao||'').toLowerCase().includes(t) &&
              !(s.nome_contato||'').toLowerCase().includes(t)) return false;
      if (filtroArea && s.area_atuacao !== filtroArea) return false;
      return true;
    });

    const container = document.getElementById('srv-lista');
    const countEl   = document.getElementById('srv-count');
    if (!container) return;

    if (countEl) countEl.textContent = `${lista.length} serviço${lista.length !== 1 ? 's' : ''}`;

    if (!lista.length) {
      container.innerHTML = `<div class="empty"><div class="empty-txt">Nenhum serviço encontrado para os filtros seleccionados.</div></div>`;
      return;
    }

    let html = '';
    lista.forEach((s, i) => { html += renderSrvCard(s, 0.04 * i); });
    container.innerHTML = html;
  }

  function bindFiltros() {
    document.getElementById('srv-search')?.addEventListener('input', function() {
      filtroTexto = this.value; renderLista();
    });
    document.getElementById('srv-area')?.addEventListener('change', function() {
      filtroArea = this.value; renderLista();
    });
  }

  function buildFiltros(lista) {
    const areas = [...new Set(lista.map(s => s.area_atuacao).filter(Boolean))].sort();
    const areaOpts = areas.map(a => `<option value="${a}">${a}</option>`).join('');
    return `
        <div class="filters-wrap">
            <input class="filter-search" id="srv-search" type="search" placeholder="Pesquisar serviços...">
            <select class="filter-select" id="srv-area">
                <option value="">Todas as áreas</option>
                ${areaOpts}
            </select>
            <div class="filter-count" id="srv-count">${lista.length} serviço${lista.length !== 1 ? 's' : ''}</div>
        </div>`;
  }

  /* ── Init ── */
  async function init() {
    try {
      const [rawServicos, configs] = await Promise.all([
        sb('servicos?select=*&ativo=eq.true&order=created_at.desc'),
        sb('configuracoes?select=chave,valor'),
      ]);

      const cfg = {};
      (Array.isArray(configs) ? configs : []).forEach(r => { cfg[r.chave] = r.valor; });
      if (cfg['copy']) document.getElementById('footer-copy').textContent = cfg['copy'];
      const addrLine = [cfg['endereco']||'', [cfg['codigo_postal']||'', cfg['cidade']||''].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
      if (addrLine) document.getElementById('footer-addr').textContent = addrLine;

      const instagram = cfg['instagram'] || 'https://www.instagram.com/zionlisboa/';
      const site      = cfg['site']      || 'https://zionchurch.org.br/';
      document.getElementById('footer-links').innerHTML = `
            <a class="footer-link" href="${site}" target="_blank">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>Site Oficial
            </a>
            <a class="footer-link" href="${instagram}" target="_blank">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>@ZionLisboa
            </a>`;

      servicosOriginais = Array.isArray(rawServicos) ? rawServicos : [];

      const adminNome    = cfg['servicos_contato']      || 'Pixinine';
      const adminContato = cfg['servicos_contato_info'] ? ` — ${cfg['servicos_contato_info']}` : '';

      document.getElementById('main-content').innerHTML = `
            <div class="intro-card">
                <div class="card-text">Aqui encontras serviços oferecidos por membros da nossa comunidade. Apoia quem é da família Zion!</div>
            </div>
            <div class="contact-banner">
                <div class="contact-banner-icon">${SVG_INFO}</div>
                <div class="contact-banner-text">Para <strong>divulgar o teu serviço ou negócio</strong>, entra em contacto com <strong>${adminNome}</strong>${adminContato}.</div>
            </div>
            ${buildFiltros(servicosOriginais)}
            <div id="srv-lista"></div>`;

      bindFiltros();
      renderLista();

    } catch (e) {
      console.error(e);
      document.getElementById('main-content').innerHTML = `<div class="empty"><div class="empty-txt">Erro ao carregar. Tenta novamente.</div></div>`;
    }
  }

  init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('SW registado:', reg.scope))
              .catch(err => console.error('SW erro:', err));
    });
  }
</script>
<button class="submit-fab" onclick="svsub_abrir()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Divulgar Serviço
</button>

<div class="submit-overlay" id="svsub-overlay" onclick="svsub_fechar(event)">
  <div class="submit-modal">
    <div class="submit-handle"></div>
    <div class="submit-modal-head">
      <span class="submit-modal-title">Divulgar Serviço ou Negócio</span>
      <button class="submit-modal-close" onclick="svsub_fechar()">×</button>
    </div>
    <div class="submit-form">
      <div class="submit-msg" id="svsub-msg"></div>

      <div class="submit-field">
        <label class="submit-label">Nome da Empresa ou Pessoa *</label>
        <input class="submit-input" id="svsub-nome" type="text" placeholder="Ex: Costa & Silva Contabilidade">
      </div>
      <div class="submit-row">
        <div class="submit-field">
          <label class="submit-label">Área de Actuação *</label>
          <select class="submit-select" id="svsub-area">
            <option value="">Selecionar...</option>
            <option>Tecnologia/TI</option><option>Saúde</option>
            <option>Educação</option><option>Comércio/Vendas</option>
            <option>Administrativo</option><option>Financeiro/Contabilidade</option>
            <option>Arte/Design</option><option>Serviços Gerais</option>
            <option>Construção Civil</option><option>Jurídico</option><option>Outros</option>
          </select>
        </div>
        <div class="submit-field">
          <label class="submit-label">Zona de Actuação</label>
          <input class="submit-input" id="svsub-zona" type="text" placeholder="Ex: Lisboa e arredores">
        </div>
      </div>
      <div class="submit-field">
        <label class="submit-label">Descrição dos Serviços</label>
        <textarea class="submit-textarea" id="svsub-descricao" placeholder="O que ofereces, especialidades, experiência..."></textarea>
      </div>
      <div class="submit-field">
        <label class="submit-label">Nome da Pessoa de Contacto</label>
        <input class="submit-input" id="svsub-contato" type="text" placeholder="Teu nome">
      </div>
      <div class="submit-row">
        <div class="submit-field">
          <label class="submit-label">Email</label>
          <input class="submit-input" id="svsub-email" type="email" placeholder="email@exemplo.com">
        </div>
        <div class="submit-field">
          <label class="submit-label">Telemóvel</label>
          <input class="submit-input" id="svsub-tel" type="tel" placeholder="+351 912 345 678">
        </div>
      </div>
      <div class="submit-row">
        <div class="submit-field">
          <label class="submit-label">Website (opcional)</label>
          <input class="submit-input" id="svsub-website" type="url" placeholder="https://...">
        </div>
        <div class="submit-field">
          <label class="submit-label">Instagram (opcional)</label>
          <input class="submit-input" id="svsub-instagram" type="url" placeholder="https://instagram.com/...">
        </div>
      </div>

      <div class="submit-actions">
        <button class="submit-btn-cancel" onclick="svsub_fechar()">Cancelar</button>
        <button class="submit-btn-send" id="svsub-send" onclick="svsub_enviar()">Enviar para Aprovação</button>
      </div>
      <div class="submit-notice">A tua submissão será analisada pela equipa antes de aparecer publicamente.</div>
    </div>
  </div>
</div>

<script>
  window.svsub_abrir = function() {
    document.getElementById('svsub-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.svsub_fechar = function(e) {
    if (e && e.target !== document.getElementById('svsub-overlay')) return;
    document.getElementById('svsub-overlay').classList.remove('open');
    document.body.style.overflow = '';
  };
  window.svsub_enviar = async function() {
    var get = function(id){ return (document.getElementById(id)?.value||'').trim()||null; };
    var nome = get('svsub-nome'), area = get('svsub-area');
    var msgEl = document.getElementById('svsub-msg');
    var btn   = document.getElementById('svsub-send');

    msgEl.className = 'submit-msg';
    if (!nome){ msgEl.textContent='Nome é obrigatório.'; msgEl.className='submit-msg error'; return; }
    if (!area){ msgEl.textContent='Área de actuação é obrigatória.'; msgEl.className='submit-msg error'; return; }

    btn.disabled = true; btn.textContent = 'A enviar...';
    try {
      var res = await fetch(window.SUPABASE_URL + '/rest/v1/rpc/public_submit_servico', {
        method: 'POST',
        headers: { 'apikey': window.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          p_nome_empresa: nome, p_area_atuacao: area,
          p_descricao: get('svsub-descricao'), p_zona_atuacao: get('svsub-zona'),
          p_nome_contato: get('svsub-contato'), p_email_contato: get('svsub-email'),
          p_telemovel_contato: get('svsub-tel'), p_website: get('svsub-website'),
          p_instagram: get('svsub-instagram'),
        }),
      });
      var data = await res.json();
      if (!res.ok || data?.ok === false) throw new Error(data?.erro || data?.message || 'Erro ao enviar.');

      msgEl.textContent = '✓ Serviço submetido! Será analisado pela equipa da Zion Lisboa.';
      msgEl.className = 'submit-msg success';
      btn.textContent = 'Enviado!';
      ['svsub-nome','svsub-area','svsub-zona','svsub-descricao','svsub-contato','svsub-email','svsub-tel','svsub-website','svsub-instagram']
              .forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
      setTimeout(function(){ svsub_fechar(); btn.disabled=false; btn.textContent='Enviar para Aprovação'; msgEl.className='submit-msg'; },3000);
    } catch(e) {
      msgEl.textContent='Erro: '+(e.message||'Tenta novamente.'); msgEl.className='submit-msg error';
      btn.disabled=false; btn.textContent='Enviar para Aprovação';
    }
  };
  </script>
</body>

</html>
