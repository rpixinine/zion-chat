<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDS26 · Lanches</title>

  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #02161e;
      --navy2:  #031f2a;
      --teal:   #009098;
      --teal-d: #007078;
      --teal-f: rgba(0,144,152,0.10);
      --text:   #e8eef0;
      --muted:  #7a9aa8;
      --border: rgba(255,255,255,0.08);
      --card:   rgba(255,255,255,0.03);
      --red:    #e53935;
      --green:  #43a047;
      --orange: #fb8c00;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:var(--navy);color:var(--text);font-family:'Lato',sans-serif;font-size:14px}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,144,152,0.12) 0%,transparent 65%)}

    .page{position:relative;z-index:1;min-height:100vh;padding-bottom:80px}

    /* HEADER */
    .site-hd{
      padding:14px 20px;
      background:linear-gradient(135deg,#0a3240 0%,var(--teal-d) 100%);
      display:flex;align-items:center;gap:12px;
      box-shadow:0 4px 24px rgba(0,0,0,0.5)
    }
    .site-hd-logo{height:28px;width:auto;object-fit:contain}
    .site-hd-logo-fb{font-family:'Cinzel',serif;font-size:16px;font-weight:700;letter-spacing:3px;color:#fff;display:none}
    .site-hd-info{flex:1}
    .site-hd-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:#fff;font-weight:700}
    .site-hd-event{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.6)}
    .event-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

    /* OPERADOR */
    .op-bar{
      display:flex;align-items:center;gap:10px;
      padding:9px 16px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border)
    }
    .op-label{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap;font-family:'Cinzel',serif}
    .op-input{
      flex:1;max-width:200px;padding:5px 10px;
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      border-radius:6px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color .15s
    }
    .op-input:focus{border-color:var(--teal)}
    .op-input::placeholder{color:var(--muted)}
    .op-ok{font-size:10px;color:var(--green);margin-left:2px}

    /* TOOLBAR */
    .toolbar{position:sticky;top:0;z-index:50;background:rgba(2,22,30,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .toolbar-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
    .ts-box{padding:9px 6px;text-align:center;background:var(--navy)}
    .ts-num{font-family:'Cinzel',serif;font-size:17px;font-weight:700}
    .ts-lbl{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-family:'Cinzel',serif;margin-top:1px}
    .ts-box.t-total .ts-num{color:var(--text)}
    .ts-box.t-ok    .ts-num{color:var(--green)}
    .ts-box.t-pend  .ts-num{color:var(--muted)}
    .ts-box.t-extra .ts-num{color:var(--orange)}

    /* SEARCH */
    .search-wrap{padding:10px 16px 0}
    .search-input{
      width:100%;padding:9px 14px;
      background:rgba(255,255,255,.05);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color .15s
    }
    .search-input:focus{border-color:var(--teal)}
    .search-input::placeholder{color:var(--muted)}

    /* CONTENT */
    .content{padding:14px 16px}

    /* DATE NAV */
    .date-hd{
      display:flex;align-items:center;gap:10px;margin-bottom:18px;
      padding:10px 16px;
      background:rgba(0,144,152,.07);border:1px solid rgba(0,144,152,.18);border-radius:10px
    }
    .date-hd-label{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--teal);flex:1}
    .date-nav-btn{
      padding:4px 12px;border-radius:6px;border:1px solid var(--border);
      background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
      font-family:'Lato',sans-serif;transition:all .15s
    }
    .date-nav-btn:hover{border-color:var(--teal);color:var(--teal)}

    /* CULTO TABS BAR */
    .culto-tabs-bar{
      display:flex;gap:6px;padding:0 0 14px;
      overflow-x:auto;scrollbar-width:none
    }
    .culto-tabs-bar::-webkit-scrollbar{display:none}
    .culto-tab{
      flex:1;min-width:120px;
      padding:10px 14px;border-radius:10px;
      border:1px solid var(--border);background:var(--card);
      cursor:pointer;transition:all .15s;text-align:left
    }
    .culto-tab:hover{border-color:rgba(0,144,152,.35)}
    .culto-tab.on{
      background:rgba(0,144,152,.12);
      border-color:var(--teal);
      box-shadow:0 0 0 1px rgba(0,144,152,.25)
    }
    .ctab-nome{
      font-family:'Cinzel',serif;font-size:12px;font-weight:600;
      color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      transition:color .15s
    }
    .culto-tab.on .ctab-nome{color:var(--text)}
    .ctab-meta{
      display:flex;align-items:center;gap:6px;margin-top:4px;
      font-size:10px;color:var(--muted)
    }
    .ctab-prog{
      margin-left:auto;padding:1px 7px;border-radius:20px;font-size:9px;
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      font-family:'Cinzel',serif;white-space:nowrap
    }
    .ctab-prog.ctab-prog-on{
      background:rgba(67,160,71,.12);border-color:rgba(67,160,71,.3);color:#a5d6a7
    }

    /* CULTO SECTION */
    .culto-section{margin-bottom:30px}
    .culto-hd{
      display:flex;align-items:center;gap:10px;
      padding:12px 16px;margin-bottom:14px;
      background:linear-gradient(90deg,rgba(0,144,152,.18) 0%,rgba(0,144,152,.04) 100%);
      border-left:4px solid var(--teal);border-radius:0 10px 10px 0
    }
    .culto-hd-info{flex:1;min-width:0}
    .culto-hd-nome{font-family:'Cinzel',serif;font-size:14px;letter-spacing:1px;color:var(--text)}
    .culto-hd-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
    .culto-hd-hora{font-size:11px;color:var(--muted)}
    .culto-hd-campus{
      font-size:9px;font-family:'Cinzel',serif;letter-spacing:.5px;
      padding:2px 8px;border-radius:20px;
      background:rgba(21,101,192,.12);color:#90caf9;border:1px solid rgba(21,101,192,.2)
    }
    .culto-hd-stats{display:flex;gap:6px;flex-shrink:0}
    .chs-pill{
      font-size:10px;padding:3px 10px;border-radius:20px;
      font-family:'Cinzel',serif;letter-spacing:.3px;white-space:nowrap
    }
    .chs-ok{background:rgba(67,160,71,.1);color:#a5d6a7;border:1px solid rgba(67,160,71,.2)}
    .chs-pend{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border)}

    /* AREA HEADER */
    .area-hd{
      display:flex;align-items:center;gap:6px;
      padding:7px 12px;margin:10px 0 6px;
      border-bottom:1px solid var(--border)
    }
    .area-hd-nome{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);flex:1}
    .area-hd-count{font-size:10px;color:var(--muted);opacity:.6}

    .vol-card.no-checkin{opacity:.55;filter:grayscale(.4)}
    .vol-checkin-tag{
      font-size:10px;color:var(--orange);font-family:'Cinzel',serif;
      letter-spacing:.3px;margin-top:3px
    }
    .btn-sem-checkin{
      background:rgba(255,255,255,.04) !important;
      border-color:var(--border) !important;
      color:var(--muted) !important;
      cursor:not-allowed !important;font-size:11px
    }

    /* VOL CARD */
    .vol-card{
      display:flex;align-items:center;gap:14px;
      padding:12px 14px;margin-bottom:8px;
      background:var(--card);border:1px solid var(--border);border-radius:12px;
      transition:border-color .15s
    }
    .vol-card.has-lanche{border-color:rgba(67,160,71,.2);background:rgba(67,160,71,.03)}
    .vol-card.has-extra{border-color:rgba(251,140,0,.2);background:rgba(251,140,0,.03)}

    /* Avatar 80px */
    .vol-avatar{
      width:80px;height:80px;border-radius:50%;flex-shrink:0;
      overflow:hidden;position:relative;
      background:var(--teal-f);border:2px solid var(--border)
    }
    .vol-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .vol-avatar-initials{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--teal)
    }
    .vol-card.has-lanche .vol-avatar{border-color:rgba(67,160,71,.5)}
    .vol-card.has-extra  .vol-avatar{border-color:rgba(251,140,0,.5)}

    .vol-info{flex:1;min-width:0}
    .vol-nome{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vol-obs{
      font-size:11px;color:var(--muted);font-style:italic;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px
    }

    .vol-actions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
    .lanche-count{
      display:inline-flex;align-items:center;gap:4px;
      font-size:11px;padding:4px 12px;border-radius:20px;
      font-family:'Cinzel',serif;letter-spacing:.3px;white-space:nowrap
    }
    .lc-none{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border)}
    .lc-ok{background:rgba(67,160,71,.12);color:#a5d6a7;border:1px solid rgba(67,160,71,.3)}
    .lc-extra{background:rgba(251,140,0,.12);color:#ffcc80;border:1px solid rgba(251,140,0,.3)}

    .btn-dar{
      padding:8px 16px;border-radius:8px;
      background:var(--teal-d);border:1px solid var(--teal);
      color:#fff;font-size:12px;font-weight:700;cursor:pointer;
      font-family:'Lato',sans-serif;letter-spacing:.5px;
      transition:all .15s;white-space:nowrap
    }
    .btn-dar:hover{background:var(--teal)}
    .btn-dar:active{transform:scale(.96)}
    .btn-extra{
      padding:6px 12px;border-radius:8px;
      background:rgba(251,140,0,.1);border:1px solid rgba(251,140,0,.3);
      color:#ffcc80;font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Lato',sans-serif;transition:all .15s;white-space:nowrap
    }
    .btn-extra:hover{background:rgba(251,140,0,.2)}

    /* MODAL */
    .modal-overlay{
      position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
      display:flex;align-items:flex-end;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity .2s
    }
    .modal-overlay.open{opacity:1;pointer-events:auto}
    .modal{
      background:var(--navy2);border:1px solid rgba(0,144,152,.2);
      border-radius:20px 20px 0 0;padding:20px 20px 36px;
      width:100%;max-width:480px;
      transform:translateY(40px);transition:transform .25s cubic-bezier(.34,1.56,.64,1)
    }
    .modal-overlay.open .modal{transform:translateY(0)}
    .modal-drag{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}

    .modal-vol{
      display:flex;align-items:center;gap:14px;
      padding:12px;background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:12px;margin-bottom:16px
    }
    .modal-avatar{
      width:56px;height:56px;border-radius:50%;flex-shrink:0;
      overflow:hidden;position:relative;
      background:var(--teal-f);border:2px solid var(--teal)
    }
    .modal-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .modal-avatar-i{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--teal)
    }
    .modal-vol-nome{font-weight:700;font-size:15px;color:var(--text)}
    .modal-vol-area{font-size:12px;color:var(--muted);margin-top:2px}
    .modal-vol-culto{font-size:11px;color:var(--teal);margin-top:2px;font-family:'Cinzel',serif;letter-spacing:.3px}

    .modal-title{font-family:'Cinzel',serif;font-size:16px;color:var(--text);margin-bottom:4px}
    .modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

    .modal-label{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px;font-family:'Cinzel',serif}
    .modal-opt{font-size:10px;color:var(--muted);font-style:italic;font-family:'Lato',sans-serif;letter-spacing:0;margin-left:4px}
    .modal-req{font-size:10px;color:var(--red);margin-left:4px}
    .modal-input{
      width:100%;padding:10px 14px;
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:13px;
      font-family:'Lato',sans-serif;outline:none;transition:border-color .15s;resize:none
    }
    .modal-input:focus{border-color:var(--teal)}
    .modal-input::placeholder{color:var(--muted)}
    .modal-btns{display:flex;gap:8px;margin-top:14px}
    .modal-btn-cancel{
      flex:1;padding:12px;border-radius:10px;
      border:1px solid var(--border);background:transparent;
      color:var(--muted);font-size:13px;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s
    }
    .modal-btn-cancel:hover{color:var(--text);border-color:var(--muted)}
    .modal-btn-ok{
      flex:2;padding:12px;border-radius:10px;border:none;
      background:var(--teal-d);color:#fff;font-size:13px;font-weight:700;
      cursor:pointer;font-family:'Lato',sans-serif;transition:opacity .15s;letter-spacing:.3px
    }
    .modal-btn-ok:hover{opacity:.85}
    .modal-btn-ok:disabled{opacity:.4;cursor:not-allowed}
    .modal-btn-ok.extra-btn{background:#b56000}

    /* MISC */
    .loader{text-align:center;padding:60px 20px;color:var(--muted)}
    .spinner{display:inline-block;width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-box{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-title{font-family:'Cinzel',serif;font-size:14px;color:var(--teal);margin-bottom:6px}

    .toast{
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--navy2);border:1px solid var(--teal);
      color:var(--text);font-size:12px;padding:10px 20px;border-radius:20px;
      z-index:300;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.error{border-color:var(--red);color:#ef9a9a}

    .refresh-btn{
      position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;
      background:var(--teal-d);border:none;color:#fff;cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:100;
      display:flex;align-items:center;justify-content:center;transition:background .15s
    }
    .refresh-btn:hover{background:var(--teal)}
  </style>
</head>
<body>
<div class="page">

  <div class="site-hd">
    <img class="site-hd-logo" src="assets/logo-zion-branca.svg" alt="Zion"
         onerror="this.style.display='none';document.getElementById('logo-fb').style.display='block'">
    <span id="logo-fb" class="site-hd-logo-fb">ZION</span>
    <div class="site-hd-info">
      <div class="site-hd-title">Distribuição de Lanches</div>
      <div class="site-hd-event"><span class="event-dot"></span>VDS26 · Em Serviço</div>
    </div>
  </div>

  <div class="op-bar">
    <span class="op-label">Operador</span>
    <input id="op-nome" class="op-input" type="text" placeholder="O teu nome…"
           maxlength="60" oninput="saveOp()" autocomplete="off">
    <span class="op-ok" id="op-ok" style="display:none">✓ Registado</span>
  </div>

  <div class="toolbar">
    <div class="toolbar-stats">
      <div class="ts-box t-total"><div class="ts-num" id="st-total">—</div><div class="ts-lbl">Escalados</div></div>
      <div class="ts-box t-ok"><div class="ts-num" id="st-ok">—</div><div class="ts-lbl">Com Lanche</div></div>
      <div class="ts-box t-pend"><div class="ts-num" id="st-pend">—</div><div class="ts-lbl">Por Receber</div></div>
      <div class="ts-box t-extra"><div class="ts-num" id="st-extra">—</div><div class="ts-lbl">Extras</div></div>
    </div>
  </div>

  <div class="search-wrap">
    <input id="search-input" class="search-input" type="search"
           placeholder="Pesquisar voluntário…" oninput="renderContent()" autocomplete="off">
  </div>

  <div class="content" id="content">
    <div class="loader"><div class="spinner"></div><br>A carregar…</div>
  </div>

</div>

<!-- MODAL: ENTREGAR LANCHE -->
<div class="modal-overlay" id="modal-lanche">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">Entregar Lanche 🥪</div>
    <div class="modal-sub">Confirmas a entrega do lanche a este voluntário?</div>
    <div class="modal-vol">
      <div class="modal-avatar" id="ml-avatar"><span class="modal-avatar-i" id="ml-ini"></span></div>
      <div>
        <div class="modal-vol-nome" id="ml-nome"></div>
        <div class="modal-vol-area" id="ml-area"></div>
        <div class="modal-vol-culto" id="ml-culto"></div>
      </div>
    </div>
    <div class="modal-label">Observações <span class="modal-opt">(opcional)</span></div>
    <textarea id="ml-obs" class="modal-input" rows="2"
              placeholder="Ex: alergia, dieta especial, preferência…" maxlength="200"></textarea>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="fecharModal('modal-lanche')">Cancelar</button>
      <button class="modal-btn-ok" id="ml-ok" onclick="confirmarLanche()">🥪 Entregar</button>
    </div>
  </div>
</div>

<!-- MODAL: LANCHE EXTRA -->
<div class="modal-overlay" id="modal-extra">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">Lanche Extra ⚡</div>
    <div class="modal-sub" id="me-sub"></div>
    <div class="modal-vol">
      <div class="modal-avatar" id="me-avatar"><span class="modal-avatar-i" id="me-ini"></span></div>
      <div>
        <div class="modal-vol-nome" id="me-nome"></div>
        <div class="modal-vol-area" id="me-area"></div>
        <div class="modal-vol-culto" id="me-culto"></div>
      </div>
    </div>
    <div class="modal-label">Motivo <span class="modal-req">* obrigatório</span></div>
    <textarea id="me-motivo" class="modal-input" rows="2"
              placeholder="Ex: serve 2 turnos, apoio técnico, coordenação…" maxlength="200"></textarea>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="fecharModal('modal-extra')">Cancelar</button>
      <button class="modal-btn-ok extra-btn" id="me-ok" onclick="confirmarExtra()">⚡ Autorizar Extra</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<button class="refresh-btn" onclick="recarregar()" title="Actualizar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
  </svg>
</button>

<script>
  const SB_URL = window.SUPABASE_URL;
  const SB_KEY = window.SUPABASE_ANON_KEY;

  function sb(path, opts) {
    return fetch(SB_URL + '/rest/v1/' + path, {
      headers: {
        'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=representation',
        ...(opts?.headers || {})
      }, ...opts
    }).then(async r => {
      const d = await r.json().catch(() => null);
      if (!r.ok) throw new Error(d?.message || d?.error || r.statusText);
      return d;
    });
  }

  function rpc(fn, params) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    }).then(async r => {
      const d = await r.json().catch(() => null);
      if (!r.ok) throw new Error(d?.message || d?.error || r.statusText);
      return d;
    });
  }

  /* ── Utils ── */
  function hojeISO() { return new Date().toISOString().split('T')[0]; }
  function addDias(iso, n) {
    const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
    return d.toISOString().split('T')[0];
  }
  const DIAS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  function dataLbl(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_PT[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }
  function iniciais(nome) {
    const p = (nome||'?').trim().split(' ').filter(Boolean);
    return p.length >= 2 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : (p[0]||'?')[0].toUpperCase();
  }
  function isWeekend(iso) { const d = new Date(iso+'T00:00:00').getDay(); return d===0||d===6; }
  function esc(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  /* ── Estado ── */
  const EG = {
    ministerios: [], minMap: {},
    escala: [], lanches: [], checkins: [],
    datas: [], dataAtual: '',
    cultoAtual: null
  };

  /* ── Operador ── */
  function saveOp() {
    const v = document.getElementById('op-nome').value.trim();
    sessionStorage.setItem('vds26_op', v);
    document.getElementById('op-ok').style.display = v ? 'inline' : 'none';
  }
  function loadOp() {
    const v = sessionStorage.getItem('vds26_op') || '';
    document.getElementById('op-nome').value = v;
    document.getElementById('op-ok').style.display = v ? 'inline' : 'none';
  }
  function getOp() { return document.getElementById('op-nome').value.trim() || 'Anónimo'; }

  /* ── Toast ── */
  let toastT;
  function showToast(msg, err) {
    clearTimeout(toastT);
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' error' : '');
    toastT = setTimeout(() => { t.className = 'toast'; }, 3200);
  }

  /* ── Modais ── */
  function abrirModal(id) { document.getElementById(id).classList.add('open'); }
  function fecharModal(id) { document.getElementById(id).classList.remove('open'); }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { fecharModal('modal-lanche'); fecharModal('modal-extra'); }
  });
  ['modal-lanche','modal-extra'].forEach(id =>
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) fecharModal(id);
    })
  );

  /* ── INIT ── */
  async function init() {
    loadOp();
    const hoje = hojeISO();
    try {
      EG.ministerios = await sb('ministerios?select=*&ativo=eq.true&order=nome') || [];
      EG.minMap = {};
      EG.ministerios.forEach(m => { EG.minMap[m.id] = m; });

      const fim = addDias(hoje, 14);
      const raw = await sb(
        `ministerio_escala?data=gte.${hoje}&data=lte.${fim}` +
        `&select=*,membros:membros_publico(id,nome,foto_url),culto:cultos(id,nome,hora_inicio,campus:campus(id,nome))` +
        `&order=data,culto_id,ministerio_id`
      ).catch(() => []) || [];

      EG.escala = raw.filter(e => isWeekend(e.data));
      EG.datas  = [...new Set(EG.escala.map(e => e.data))].sort();
      EG.dataAtual = EG.datas.find(d => d >= hoje) || EG.datas[0] || hoje;

      // ── CORRIGIDO: carregarLanches já filtra por EG.dataAtual ──
      await carregarLanches();
    } catch(e) {
      document.getElementById('content').innerHTML =
        `<div class="empty-box"><div class="empty-title">Erro ao carregar</div><div>${e.message}</div></div>`;
    }
  }

  /*
   * ── CORRIGIDO ──────────────────────────────────────────────────────────────
   * carregarLanches() filtra SEMPRE pelo dia actualmente seleccionado
   * (EG.dataAtual), usando o campo registado_em para os lanches e o campo
   * data para os check-ins.  Assim, registos de dias anteriores nunca
   * aparecem como lanches do dia actual.
   * ──────────────────────────────────────────────────────────────────────────
   */
  async function carregarLanches() {
    const dia = EG.dataAtual;

    // Intervalo do dia seleccionado em UTC (cobre fusos com margem de ±12h)
    // A coluna registado_em é timestamptz, por isso filtramos pelo prefixo do dia
    const diaInicio = dia + 'T00:00:00';
    const diaFim    = dia + 'T23:59:59';

    const [lanches, checkins] = await Promise.all([
      sb(
        `vds26_lanches?select=id,membro_id,ministerio_id,motivo,registado_em` +
        `&registado_em=gte.${diaInicio}` +
        `&registado_em=lte.${diaFim}` +
        `&order=registado_em`
      ).catch(() => []),
      sb(
        `ministerio_checkin?data=eq.${dia}&select=membro_id,culto_id,ministerio_id,status`
      ).catch(() => [])
    ]);

    EG.lanches  = lanches  || [];
    EG.checkins = checkins || [];
    renderContent();
  }

  function buildLancheMap() {
    // Os lanches em EG.lanches já estão filtrados pelo dia activo,
    // por isso não é necessário filtrar de novo aqui.
    const map = {};
    EG.lanches.forEach(l => {
      if (!map[l.membro_id]) map[l.membro_id] = [];
      map[l.membro_id].push(l);
    });
    return map;
  }

  /* ── RENDER ── */
  function renderContent() {
    const lancheMap = buildLancheMap();
    const search = (document.getElementById('search-input').value || '').toLowerCase().trim();

    let escDia = EG.escala.filter(e => e.data === EG.dataAtual);

    /* Stats (sem filtro de pesquisa) */
    const membrosUnicos = [...new Set(escDia.map(e => e.membro_id))];
    const total     = membrosUnicos.length;
    const comLanche = membrosUnicos.filter(id => (lancheMap[id]||[]).length >= 1).length;
    const extras    = membrosUnicos.reduce((a, id) => a + Math.max(0, (lancheMap[id]||[]).length - 1), 0);
    document.getElementById('st-total').textContent = total;
    document.getElementById('st-ok').textContent    = comLanche;
    document.getElementById('st-pend').textContent  = total - comLanche;
    document.getElementById('st-extra').textContent = extras;

    /* Filtrar por pesquisa */
    if (search) escDia = escDia.filter(e => (e.membros?.nome||'').toLowerCase().includes(search));

    const el = document.getElementById('content');
    if (!escDia.length) {
      el.innerHTML = search
        ? `<div class="empty-box"><div class="empty-title">Sem resultados</div><div>Nenhum voluntário encontrado para "${search}".</div></div>`
        : `<div class="empty-box"><div class="empty-title">Sem escalas</div><div>Nenhum voluntário escalado para este dia.</div></div>`;
      return;
    }

    /* Agrupar por culto */
    const porCulto = new Map();
    escDia.forEach(e => {
      if (!porCulto.has(e.culto_id)) porCulto.set(e.culto_id, { culto: e.culto, entries: [] });
      porCulto.get(e.culto_id).entries.push(e);
    });

    const cultosOrdenados = [...porCulto.values()]
      .sort((a,b) => (a.culto?.hora_inicio||'').localeCompare(b.culto?.hora_inicio||''));

    /* Garantir cultoAtual válido para este dia */
    const ids = cultosOrdenados.map(c => c.culto?.id);
    if (!EG.cultoAtual || !ids.includes(EG.cultoAtual)) {
      EG.cultoAtual = ids[0] || null;
    }

    let html = buildDateNav();

    /* Abas por culto */
    if (cultosOrdenados.length > 1) {
      html += `<div class="culto-tabs-bar">` +
        cultosOrdenados.map(({ culto }) => {
          const hora   = (culto?.hora_inicio||'').slice(0,5);
          const campus = culto?.campus?.nome ? ` · ${culto.campus.nome}` : '';
          const ativo  = EG.cultoAtual === culto?.id;
          const membrosCulto = [...new Set(
            (porCulto.get(culto?.id)?.entries||[]).map(e=>e.membro_id)
          )];
          const okCulto = membrosCulto.filter(id=>(lancheMap[id]||[]).length>=1).length;
          const prog = membrosCulto.length
            ? `<span class="ctab-prog ${ativo?'ctab-prog-on':''}">${okCulto}/${membrosCulto.length}</span>`
            : '';
          return `<div class="culto-tab ${ativo?'on':''}"
              onclick="selCulto('${culto?.id}')">
              <div class="ctab-nome">${culto?.nome||'Culto'}</div>
              <div class="ctab-meta">${hora}${campus} ${prog}</div>
            </div>`;
        }).join('') +
        `</div>`;
    }

    /* Mostrar só o culto activo */
    const visíveis = cultosOrdenados.filter(c => c.culto?.id === EG.cultoAtual);
    visíveis.forEach(({ culto, entries }) => {
      html += buildCultoSection(culto, entries, lancheMap);
    });

    el.innerHTML = html;
  }

  function buildDateNav() {
    const idx  = EG.datas.indexOf(EG.dataAtual);
    const prev = idx > 0 ? `<button class="date-nav-btn" onclick="navData(-1)">← Ant.</button>` : '';
    const next = idx < EG.datas.length-1 ? `<button class="date-nav-btn" onclick="navData(1)">Próx. →</button>` : '';
    return `<div class="date-hd">
      <div class="date-hd-label">${dataLbl(EG.dataAtual)}</div>
      <div style="display:flex;gap:6px">${prev}${next}</div>
    </div>`;
  }

  /*
   * ── CORRIGIDO ──────────────────────────────────────────────────────────────
   * navData() chama carregarLanches() para recarregar os lanches e check-ins
   * do novo dia antes de renderizar. Antes chamava apenas renderContent(),
   * o que mantinha em memória os dados do dia anterior.
   * ──────────────────────────────────────────────────────────────────────────
   */
  async function navData(n) {
    const novo = EG.datas[EG.datas.indexOf(EG.dataAtual) + n];
    if (!novo) return;
    EG.dataAtual  = novo;
    EG.cultoAtual = null;
    // Mostrar feedback visual imediato enquanto recarrega
    document.getElementById('content').innerHTML =
      `<div class="loader"><div class="spinner"></div><br>A carregar…</div>`;
    await carregarLanches();
  }

  function buildCultoSection(culto, entries, lancheMap) {
    const membros = [...new Set(entries.map(e => e.membro_id))];
    const totalC  = membros.length;
    const okC     = membros.filter(id => (lancheMap[id]||[]).length >= 1).length;
    const hora    = (culto?.hora_inicio||'').slice(0,5);
    const campus  = culto?.campus?.nome;

    const pillOk   = okC       ? `<span class="chs-pill chs-ok">✓ ${okC} lanches</span>` : '';
    const pillPend = totalC-okC > 0 ? `<span class="chs-pill chs-pend">${totalC-okC} por receber</span>` : '';

    const porArea = new Map();
    entries.forEach(e => {
      if (!porArea.has(e.ministerio_id)) porArea.set(e.ministerio_id, []);
      porArea.get(e.ministerio_id).push(e);
    });
    const membroVistoCulto = new Set();
    const areasOrdenadas = [...porArea.entries()]
      .map(([id, es]) => ({ min: EG.minMap[id], entries: es }))
      .filter(x => x.min)
      .sort((a,b) => a.min.nome.localeCompare(b.min.nome, 'pt'));

    let areasHtml = '';
    areasOrdenadas.forEach(({ min, entries: es }) => {
      const vols = es.filter(e => {
        if (membroVistoCulto.has(e.membro_id)) return false;
        membroVistoCulto.add(e.membro_id);
        return true;
      });
      if (!vols.length) return;
      areasHtml += `<div class="area-hd">
        <div class="area-hd-nome">${min.nome}</div>
        <div class="area-hd-count">${vols.length}</div>
      </div>`;
      areasHtml += vols.map(e => buildVolCard(e, lancheMap, min, culto)).join('');
    });

    return `<div class="culto-section">
      <div class="culto-hd">
        <div class="culto-hd-info">
          <div class="culto-hd-nome">${culto?.nome||'Culto'}</div>
          <div class="culto-hd-meta">
            ${hora ? `<span class="culto-hd-hora">⏰ ${hora}</span>` : ''}
            ${campus ? `<span class="culto-hd-campus">${campus}</span>` : ''}
          </div>
        </div>
        <div class="culto-hd-stats">${pillOk}${pillPend}</div>
      </div>
      ${areasHtml}
    </div>`;
  }

  function buildVolCard(e, lancheMap, min, culto) {
    const lanches  = lancheMap[e.membro_id] || [];
    const count    = lanches.length;
    const foto     = e.membros?.foto_url;
    const nome     = e.membros?.nome || '—';
    const ini      = iniciais(nome);
    const ultimaObs = lanches.length ? lanches[lanches.length-1].motivo : null;

    const checkedIn = EG.checkins.some(c =>
      c.membro_id === e.membro_id &&
      c.culto_id  === e.culto_id  &&
      (c.status === 'presente' || c.status === 'atrasado')
    );

    let lcHtml, btnHtml;
    if (count === 0) {
      lcHtml = `<div class="lanche-count lc-none">0 lanches</div>`;
      if (checkedIn) {
        btnHtml = `<button class="btn-dar"
          onclick="abrirLanche('${esc(e.membro_id)}','${esc(min.id)}','${esc(nome)}','${esc(foto||'')}','${esc(min.nome)}','${esc(culto?.nome||'')}')">
          🥪 Dar Lanche</button>`;
      } else {
        btnHtml = `<button class="btn-dar btn-sem-checkin" disabled title="Voluntário ainda não fez check-in">
          ⏳ Sem Check-in</button>`;
      }
    } else if (count === 1) {
      lcHtml  = `<div class="lanche-count lc-ok">✓ 1 lanche</div>`;
      btnHtml = `<button class="btn-extra"
        onclick="abrirExtra('${esc(e.membro_id)}','${esc(min.id)}','${esc(nome)}','${esc(foto||'')}','${esc(min.nome)}','${esc(culto?.nome||'')}',${count})">
        + Extra</button>`;
    } else {
      lcHtml  = `<div class="lanche-count lc-extra">⚡ ${count} lanches</div>`;
      btnHtml = `<button class="btn-extra"
        onclick="abrirExtra('${esc(e.membro_id)}','${esc(min.id)}','${esc(nome)}','${esc(foto||'')}','${esc(min.nome)}','${esc(culto?.nome||'')}',${count})">
        + Extra</button>`;
    }

    const cardCls  = count === 0 ? (checkedIn ? '' : 'no-checkin') : count === 1 ? 'has-lanche' : 'has-extra';
    const obsHtml  = ultimaObs ? `<div class="vol-obs">💬 ${ultimaObs}</div>` : '';

    return `<div class="vol-card ${cardCls}">
      <div class="vol-avatar">
        <div class="vol-avatar-initials">${ini}</div>
        ${foto ? `<img src="${foto}" alt="" onerror="this.style.display='none'">` : ''}
      </div>
      <div class="vol-info">
        <div class="vol-nome">${nome}</div>
        ${!checkedIn && count === 0 ? `<div class="vol-checkin-tag">Aguarda check-in</div>` : ''}
        ${obsHtml}
      </div>
      <div class="vol-actions">
        ${lcHtml}
        ${btnHtml}
      </div>
    </div>`;
  }

  /* ── MODAL: PRIMEIRO LANCHE ── */
  let pendente = null;

  function preencherAvatar(prefixo, foto, ini) {
    const avEl  = document.getElementById(prefixo + '-avatar');
    const iniEl = document.getElementById(prefixo + '-ini');
    iniEl.textContent = ini;
    const ex = avEl.querySelector('img');
    if (ex) ex.remove();
    if (foto) {
      const img = Object.assign(document.createElement('img'), { src: foto, alt: '' });
      img.onerror = () => img.style.display = 'none';
      avEl.insertBefore(img, iniEl);
    }
  }

  function abrirLanche(membroId, minId, nome, foto, areaNome, cultoNome) {
    pendente = { membroId, minId, nome, foto, areaNome, cultoNome };
    preencherAvatar('ml', foto, iniciais(nome));
    document.getElementById('ml-nome').textContent  = nome;
    document.getElementById('ml-area').textContent  = areaNome;
    document.getElementById('ml-culto').textContent = cultoNome;
    document.getElementById('ml-obs').value = '';
    abrirModal('modal-lanche');
  }

  async function confirmarLanche() {
    if (!pendente) return;
    const obs = document.getElementById('ml-obs').value.trim();
    const btn = document.getElementById('ml-ok');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await rpc('registar_lanche_vds26', {
        p_membro_id:     pendente.membroId,
        p_ministerio_id: pendente.minId,
        p_motivo:        obs || null,
        p_registado_por: getOp()
      });
      if (!res.success) throw new Error(res.error);
      fecharModal('modal-lanche');
      showToast(`✓ Lanche entregue a ${pendente.nome}`);
      await carregarLanches();
    } catch(e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '🥪 Entregar';
      pendente = null;
    }
  }

  /* ── MODAL: EXTRA ── */
  function abrirExtra(membroId, minId, nome, foto, areaNome, cultoNome, count) {
    pendente = { membroId, minId, nome, foto, areaNome, cultoNome };
    preencherAvatar('me', foto, iniciais(nome));
    document.getElementById('me-nome').textContent  = nome;
    document.getElementById('me-area').textContent  = areaNome;
    document.getElementById('me-culto').textContent = cultoNome;
    document.getElementById('me-sub').textContent   =
      `${nome} já recebeu ${count} lanche${count>1?'s':''}. Indica o motivo para autorizar mais um.`;
    document.getElementById('me-motivo').value = '';
    abrirModal('modal-extra');
    setTimeout(() => document.getElementById('me-motivo').focus(), 300);
  }

  async function confirmarExtra() {
    if (!pendente) return;
    const motivo = document.getElementById('me-motivo').value.trim();
    if (!motivo) { showToast('Escreve o motivo para o lanche extra.', true); return; }
    const btn = document.getElementById('me-ok');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await rpc('registar_lanche_vds26', {
        p_membro_id:     pendente.membroId,
        p_ministerio_id: pendente.minId,
        p_motivo:        motivo,
        p_registado_por: getOp()
      });
      if (!res.success) throw new Error(res.error);
      fecharModal('modal-extra');
      showToast(`✓ Extra autorizado para ${pendente.nome}`);
      await carregarLanches();
    } catch(e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '⚡ Autorizar Extra';
      pendente = null;
    }
  }

  function selCulto(cultoId) {
    EG.cultoAtual = cultoId;
    renderContent();
  }

  async function recarregar() {
    await carregarLanches();
    showToast('Dados actualizados');
  }

  init();
</script>
</body>
</html>
