<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VDS26 · Lanches</title>

  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #02161e;
      --navy2:  #031f2a;
      --teal:   #009098;
      --teal-d: #007078;
      --teal-f: rgba(0,144,152,0.10);
      --text:   #e8eef0;
      --muted:  #7a9aa8;
      --border: rgba(255,255,255,0.08);
      --card:   rgba(255,255,255,0.03);
      --red:    #e53935;
      --green:  #43a047;
      --orange: #fb8c00;
      --radius: 12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:var(--navy);color:var(--text);font-family:'Lato',sans-serif;font-size:14px}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,144,152,0.12) 0%,transparent 65%)}

    /* ── PAGE ── */
    .page{position:relative;z-index:1;min-height:100vh;padding-bottom:80px}

    /* ── HEADER ── */
    .site-hd{
      padding:14px 20px;
      background:linear-gradient(135deg,#0a3240 0%,var(--teal-d) 100%);
      display:flex;align-items:center;gap:12px;
      box-shadow:0 4px 24px rgba(0,0,0,0.5)
    }
    .site-hd-logo{height:28px;width:auto;object-fit:contain}
    .site-hd-logo-fb{font-family:'Cinzel',serif;font-size:16px;font-weight:700;letter-spacing:3px;color:#fff;display:none}
    .site-hd-info{flex:1;min-width:0}
    .site-hd-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2px;color:#fff;font-weight:700}
    .site-hd-event{
      display:inline-flex;align-items:center;gap:5px;margin-top:3px;
      font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.6)
    }
    .event-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.85)}}

    /* ── OPERADOR BAR ── */
    .op-bar{
      display:flex;align-items:center;gap:10px;
      padding:10px 16px;
      background:rgba(0,0,0,0.25);border-bottom:1px solid var(--border)
    }
    .op-label{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap;font-family:'Cinzel',serif}
    .op-input{
      flex:1;max-width:220px;padding:5px 10px;
      background:rgba(255,255,255,0.06);border:1px solid var(--border);
      border-radius:6px;color:var(--text);font-size:12px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color 0.15s
    }
    .op-input:focus{border-color:var(--teal)}
    .op-input::placeholder{color:var(--muted)}
    .op-status{font-size:10px;color:var(--muted);margin-left:auto;text-align:right;flex-shrink:0}

    /* ── STICKY TOOLBAR ── */
    .toolbar{
      position:sticky;top:0;z-index:50;
      background:rgba(2,22,30,0.95);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border)
    }
    .toolbar-stats{
      display:grid;grid-template-columns:repeat(4,1fr);
      gap:1px;background:var(--border)
    }
    .ts-box{
      padding:10px 8px;text-align:center;background:var(--navy);
      cursor:default
    }
    .ts-num{font-family:'Cinzel',serif;font-size:18px;font-weight:700}
    .ts-lbl{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:'Cinzel',serif;margin-top:1px}
    .ts-box.t-total .ts-num{color:var(--text)}
    .ts-box.t-ok    .ts-num{color:var(--green)}
    .ts-box.t-pend  .ts-num{color:var(--muted)}
    .ts-box.t-extra .ts-num{color:var(--orange)}

    /* ── CULTO TABS ── */
    .culto-tabs{
      display:flex;gap:6px;flex-wrap:wrap;
      padding:10px 14px;
      border-top:1px solid var(--border)
    }
    .ctab{
      padding:5px 14px;border-radius:20px;
      border:1px solid var(--border);background:transparent;
      font-size:11px;cursor:pointer;color:var(--muted);
      transition:all 0.15s;white-space:nowrap;font-family:'Lato',sans-serif
    }
    .ctab:hover{border-color:var(--teal);color:var(--teal)}
    .ctab.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}

    /* ── SEARCH ── */
    .search-wrap{padding:10px 16px 0}
    .search-input{
      width:100%;padding:9px 14px;
      background:rgba(255,255,255,0.05);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color 0.15s
    }
    .search-input:focus{border-color:var(--teal)}
    .search-input::placeholder{color:var(--muted)}

    /* ── CONTENT ── */
    .content{padding:16px}

    /* ── DATE HEADER ── */
    .date-hd{
      display:flex;align-items:center;gap:10px;margin-bottom:16px;
      padding:10px 16px;
      background:rgba(0,144,152,0.07);
      border:1px solid rgba(0,144,152,0.18);border-radius:10px
    }
    .date-hd-label{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--teal);flex:1}
    .date-hd-nav{display:flex;gap:6px}
    .date-nav-btn{
      padding:4px 12px;border-radius:6px;border:1px solid var(--border);
      background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
      font-family:'Lato',sans-serif;transition:all 0.15s
    }
    .date-nav-btn:hover{border-color:var(--teal);color:var(--teal)}

    /* ── PILAR SECTION ── */
    .pilar-section{margin-bottom:28px}
    .pilar-hd{
      display:flex;align-items:center;gap:8px;
      padding:7px 14px;margin-bottom:12px;
      border-bottom:2px solid rgba(0,144,152,0.25)
    }
    .pilar-nome{font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);flex:1}
    .pilar-stat{font-size:10px;color:var(--muted);background:var(--card);padding:2px 8px;border-radius:20px;border:1px solid var(--border)}

    /* ── AREA HEADER ── */
    .area-hd{
      display:flex;align-items:center;gap:8px;
      padding:10px 14px;
      background:linear-gradient(90deg,rgba(0,144,152,0.1) 0%,transparent 100%);
      border-left:3px solid var(--teal);border-radius:0 8px 8px 0;
      margin-bottom:8px
    }
    .area-nome{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.5px;color:var(--text);flex:1}
    .area-stats{display:flex;gap:5px;flex-shrink:0}
    .area-stat-pill{
      font-size:10px;padding:2px 8px;border-radius:20px;
      font-family:'Cinzel',serif;letter-spacing:0.3px
    }
    .asp-ok{background:rgba(67,160,71,0.1);color:#a5d6a7;border:1px solid rgba(67,160,71,0.2)}
    .asp-pend{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border)}

    /* ── VOL CARD ── */
    .vol-card{
      display:flex;align-items:center;gap:12px;
      padding:10px 12px;margin-bottom:6px;
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      transition:border-color 0.15s
    }
    .vol-card:hover{border-color:rgba(0,144,152,0.2)}
    .vol-card.has-lanche{border-color:rgba(67,160,71,0.15)}
    .vol-card.has-extra{border-color:rgba(251,140,0,0.2)}

    /* Avatar */
    .vol-avatar{
      width:40px;height:40px;border-radius:50%;flex-shrink:0;
      overflow:hidden;position:relative;background:var(--teal-f);
      border:2px solid var(--border)
    }
    .vol-avatar img{width:100%;height:100%;object-fit:cover}
    .vol-avatar-initials{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--teal)
    }
    .vol-card.has-lanche .vol-avatar{border-color:rgba(67,160,71,0.4)}
    .vol-card.has-extra .vol-avatar{border-color:rgba(251,140,0,0.4)}

    /* Info */
    .vol-info{flex:1;min-width:0}
    .vol-nome{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vol-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
    .vol-area-tag{font-size:10px;color:var(--muted)}
    .vol-papel{font-size:9px;font-family:'Cinzel',serif;letter-spacing:0.3px;color:var(--muted);opacity:.7}

    /* Lanche status */
    .vol-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .lanche-count{
      display:flex;align-items:center;gap:4px;
      font-size:11px;padding:3px 10px;border-radius:20px;
      font-family:'Cinzel',serif;letter-spacing:0.3px;white-space:nowrap
    }
    .lc-none{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border)}
    .lc-ok{background:rgba(67,160,71,0.12);color:#a5d6a7;border:1px solid rgba(67,160,71,0.25)}
    .lc-extra{background:rgba(251,140,0,0.12);color:#ffcc80;border:1px solid rgba(251,140,0,0.25)}

    /* Action buttons */
    .btn-dar{
      padding:7px 14px;border-radius:8px;
      background:var(--teal-d);border:1px solid var(--teal);
      color:#fff;font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Lato',sans-serif;letter-spacing:0.5px;
      transition:all 0.15s;white-space:nowrap
    }
    .btn-dar:hover{background:var(--teal)}
    .btn-dar:active{transform:scale(0.96)}
    .btn-extra{
      padding:6px 12px;border-radius:8px;
      background:rgba(251,140,0,0.1);border:1px solid rgba(251,140,0,0.25);
      color:#ffcc80;font-size:10px;font-weight:700;cursor:pointer;
      font-family:'Lato',sans-serif;letter-spacing:0.5px;
      transition:all 0.15s;white-space:nowrap
    }
    .btn-extra:hover{background:rgba(251,140,0,0.18)}
    .btn-undo{
      padding:4px 8px;border-radius:6px;
      background:transparent;border:1px solid var(--border);
      color:var(--muted);font-size:10px;cursor:pointer;
      font-family:'Lato',sans-serif;transition:all 0.15s
    }
    .btn-undo:hover{border-color:var(--red);color:#ef9a9a}

    /* ── MODAL ── */
    .modal-overlay{
      position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;
      padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s
    }
    .modal-overlay.open{opacity:1;pointer-events:auto}
    .modal{
      background:var(--navy2);border:1px solid rgba(0,144,152,0.25);
      border-radius:16px;padding:24px;width:100%;max-width:380px;
      transform:translateY(20px);transition:transform 0.2s
    }
    .modal-overlay.open .modal{transform:translateY(0)}
    .modal-icon{font-size:28px;margin-bottom:12px;text-align:center}
    .modal-title{font-family:'Cinzel',serif;font-size:15px;color:var(--text);text-align:center;margin-bottom:4px}
    .modal-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px}
    .modal-label{font-size:11px;color:var(--muted);letter-spacing:0.5px;margin-bottom:6px;font-family:'Cinzel',serif}
    .modal-input{
      width:100%;padding:10px 14px;
      background:rgba(255,255,255,0.06);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:13px;font-family:'Lato',sans-serif;
      outline:none;transition:border-color 0.15s;resize:none
    }
    .modal-input:focus{border-color:var(--teal)}
    .modal-input::placeholder{color:var(--muted)}
    .modal-btns{display:flex;gap:8px;margin-top:16px}
    .modal-btn-cancel{
      flex:1;padding:10px;border-radius:8px;
      border:1px solid var(--border);background:transparent;
      color:var(--muted);font-size:13px;cursor:pointer;font-family:'Lato',sans-serif;
      transition:all 0.15s
    }
    .modal-btn-cancel:hover{border-color:var(--muted);color:var(--text)}
    .modal-btn-ok{
      flex:2;padding:10px;border-radius:8px;
      border:none;background:var(--orange);
      color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;
      transition:opacity 0.15s
    }
    .modal-btn-ok:hover{opacity:0.85}
    .modal-btn-ok:disabled{opacity:0.4;cursor:not-allowed}

    /* ── CONFIRM MODAL (primeiro lanche) ── */
    .confirm-vol-info{
      display:flex;align-items:center;gap:12px;
      padding:12px;background:rgba(255,255,255,0.04);
      border-radius:10px;margin-bottom:18px
    }
    .confirm-avatar{
      width:44px;height:44px;border-radius:50%;
      overflow:hidden;background:var(--teal-f);border:2px solid var(--teal);
      flex-shrink:0;display:flex;align-items:center;justify-content:center
    }
    .confirm-avatar img{width:100%;height:100%;object-fit:cover}
    .confirm-avatar-i{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--teal)}
    .confirm-nome{font-weight:700;font-size:14px;color:var(--text)}
    .confirm-area{font-size:11px;color:var(--muted);margin-top:2px}

    /* ── LOADER ── */
    .loader{text-align:center;padding:60px 20px;color:var(--muted)}
    .spinner{display:inline-block;width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:10px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── EMPTY ── */
    .empty-box{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-title{font-family:'Cinzel',serif;font-size:14px;color:var(--teal);margin-bottom:6px}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--navy2);border:1px solid var(--teal);
      color:var(--text);font-size:12px;padding:10px 18px;border-radius:20px;
      z-index:300;opacity:0;transition:all 0.25s;white-space:nowrap;
      pointer-events:none
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.error{border-color:var(--red);color:#ef9a9a}

    /* ── REFRESH ── */
    .refresh-btn{
      position:fixed;bottom:20px;right:20px;
      width:44px;height:44px;border-radius:50%;
      background:var(--teal-d);border:none;color:#fff;font-size:16px;cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:100;
      display:flex;align-items:center;justify-content:center;transition:background 0.15s
    }
    .refresh-btn:hover{background:var(--teal)}

    @media(max-width:480px){
      .vol-card{padding:8px 10px;gap:8px}
      .vol-avatar{width:36px;height:36px}
      .btn-dar{padding:6px 10px;font-size:10px}
      .btn-extra{padding:5px 9px;font-size:9px}
    }
  </style>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <div class="site-hd">
    <img class="site-hd-logo" src="assets/logo-zion-branca.svg" alt="Zion"
         onerror="this.style.display='none';document.getElementById('logo-fb').style.display='block'">
    <span id="logo-fb" class="site-hd-logo-fb" style="display:none">ZION</span>
    <div class="site-hd-info">
      <div class="site-hd-title">Distribuição de Lanches</div>
      <div class="site-hd-event">
        <span class="event-dot"></span>
        VDS26 · Em Serviço
      </div>
    </div>
  </div>

  <!-- OPERADOR -->
  <div class="op-bar">
    <span class="op-label">Operador</span>
    <input id="op-nome" class="op-input" type="text" placeholder="O teu nome…" maxlength="60"
           oninput="saveOp()" autocomplete="off">
    <div class="op-status" id="op-status"></div>
  </div>

  <!-- TOOLBAR: STATS + CULTO TABS -->
  <div class="toolbar">
    <div class="toolbar-stats">
      <div class="ts-box t-total"><div class="ts-num" id="st-total">—</div><div class="ts-lbl">Escalados</div></div>
      <div class="ts-box t-ok"><div class="ts-num" id="st-ok">—</div><div class="ts-lbl">Com Lanche</div></div>
      <div class="ts-box t-pend"><div class="ts-num" id="st-pend">—</div><div class="ts-lbl">Por Receber</div></div>
      <div class="ts-box t-extra"><div class="ts-num" id="st-extra">—</div><div class="ts-lbl">Extras</div></div>
    </div>
    <div class="culto-tabs" id="culto-tabs" style="display:none"></div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="search-input" class="search-input" type="search"
           placeholder="Pesquisar voluntário…" oninput="aplicarFiltros()" autocomplete="off">
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div class="loader"><div class="spinner"></div><br>A carregar…</div>
  </div>

</div>

<!-- MODAL: CONFIRMAR PRIMEIRO LANCHE -->
<div class="modal-overlay" id="modal-confirmar">
  <div class="modal">
    <div class="modal-icon">🥪</div>
    <div class="modal-title">Confirmar Lanche</div>
    <div class="modal-sub" id="mc-sub">Confirmas a entrega do lanche?</div>
    <div class="confirm-vol-info">
      <div class="confirm-avatar" id="mc-avatar">
        <span class="confirm-avatar-i" id="mc-ini"></span>
      </div>
      <div>
        <div class="confirm-nome" id="mc-nome"></div>
        <div class="confirm-area" id="mc-area"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="fecharModal('modal-confirmar')">Cancelar</button>
      <button class="modal-btn-ok" id="mc-ok" onclick="confirmarLanche()">✓ Entregar</button>
    </div>
  </div>
</div>

<!-- MODAL: LANCHE EXTRA COM MOTIVO -->
<div class="modal-overlay" id="modal-extra">
  <div class="modal">
    <div class="modal-icon">➕</div>
    <div class="modal-title">Lanche Extra</div>
    <div class="modal-sub" id="me-sub"></div>
    <div class="confirm-vol-info">
      <div class="confirm-avatar" id="me-avatar">
        <span class="confirm-avatar-i" id="me-ini"></span>
      </div>
      <div>
        <div class="confirm-nome" id="me-nome"></div>
        <div class="confirm-area" id="me-area"></div>
      </div>
    </div>
    <div class="modal-label">Motivo (obrigatório)</div>
    <textarea id="me-motivo" class="modal-input" rows="2"
              placeholder="Ex: Serve 2 turnos, Apoio técnico…" maxlength="200"></textarea>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="fecharModal('modal-extra')">Cancelar</button>
      <button class="modal-btn-ok" id="me-ok" onclick="confirmarExtra()">✓ Autorizar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<button class="refresh-btn" onclick="recarregar()" title="Actualizar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="23 4 23 10 17 10"/>
    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
  </svg>
</button>

<script>
  const SB_URL = window.SUPABASE_URL;
  const SB_KEY = window.SUPABASE_ANON_KEY;

  /* ── sb helper ── */
  function sb(path, opts) {
    return fetch(SB_URL + '/rest/v1/' + path, {
      headers: {
        'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=representation',
        ...(opts?.headers || {})
      }, ...opts
    }).then(async r => {
      const d = await r.json().catch(() => null);
      if (!r.ok) throw new Error(d?.message || d?.error || r.statusText);
      return d;
    });
  }

  function rpc(fn, params) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(params)
    }).then(async r => {
      const d = await r.json().catch(() => null);
      if (!r.ok) throw new Error(d?.message || d?.error || r.statusText);
      return d;
    });
  }

  /* ── Utils ── */
  function hojeISO() { return new Date().toISOString().split('T')[0]; }
  function addDias(iso, n) {
    const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
    return d.toISOString().split('T')[0];
  }
  const DIAS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  function dataLbl(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_PT[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }
  function iniciais(nome) {
    const p = (nome||'?').trim().split(' ').filter(Boolean);
    if (p.length >= 2) return (p[0][0] + p[p.length-1][0]).toUpperCase();
    return (p[0]||'?')[0].toUpperCase();
  }

  /* ── ESTADO ── */
  const EG = {
    ministerios: [], lideresMap: {},
    escala: [], lanches: [],   /* lanches: [{id, membro_id, ministerio_id, motivo}] */
    cultosMap: {}, datas: [],
    dataAtual: '',
    filtroCulto: null,
    searchTerm: ''
  };

  /* ── OPERADOR ── */
  function saveOp() {
    const v = document.getElementById('op-nome').value.trim();
    sessionStorage.setItem('vds26_op', v);
    document.getElementById('op-status').textContent = v ? '✓ Registado' : '';
  }
  function loadOp() {
    const v = sessionStorage.getItem('vds26_op') || '';
    document.getElementById('op-nome').value = v;
    document.getElementById('op-status').textContent = v ? '✓ Registado' : '';
  }
  function getOp() { return document.getElementById('op-nome').value.trim() || 'Anónimo'; }

  /* ── TOAST ── */
  let toastTimer;
  function showToast(msg, erro) {
    clearTimeout(toastTimer);
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (erro ? ' error' : '');
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  /* ── MODAL HELPERS ── */
  function abrirModal(id) { document.getElementById(id).classList.add('open'); }
  function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

  /* ── INIT ── */
  async function init() {
    loadOp();
    const hoje = hojeISO();
    try {
      /* 1. Ministérios */
      EG.ministerios = await sb('ministerios?select=*&ativo=eq.true&order=nome') || [];

      /* 2. Líderes */
      const lr = await sb('ministerio_membros?papel=eq.lider&ativo=eq.true&select=ministerio_id,membros:membros_publico(id,nome)').catch(()=>[]);
      EG.lideresMap = {};
      (lr||[]).forEach(l => {
        if (!l.membros) return;
        if (!EG.lideresMap[l.ministerio_id]) EG.lideresMap[l.ministerio_id] = [];
        EG.lideresMap[l.ministerio_id].push(l.membros);
      });

      /* 3. Escala próximos 14 dias */
      const fim = addDias(hoje, 14);
      EG.escala = await sb(
              `ministerio_escala?data=gte.${hoje}&data=lte.${fim}` +
              `&select=*,membros:membros_publico(id,nome,foto_url),culto:cultos(id,nome,hora_inicio,campus:campus(id,nome))` +
              `&order=data,ministerio_id`
      ).catch(()=>[]) || [];

      /* 4. Cultos map */
      EG.cultosMap = {};
      EG.escala.forEach(e => { if (e.culto) EG.cultosMap[e.culto_id] = e.culto; });

      /* 5. Datas disponíveis */
      EG.datas = [...new Set(EG.escala.map(e => e.data))].sort();
      EG.dataAtual = EG.datas.find(d => d >= hoje) || EG.datas[0] || hoje;

      /* 6. Lanches VDS26 */
      await carregarLanches();

    } catch(e) {
      document.getElementById('content').innerHTML =
              `<div class="empty-box"><div class="empty-title">Erro ao carregar</div><div>${e.message}</div></div>`;
    }
  }

  async function carregarLanches() {
    EG.lanches = await sb('vds26_lanches?select=id,membro_id,ministerio_id,motivo,registado_em&order=registado_em').catch(()=>[]) || [];
    renderTudo();
  }

  /* ── LANCHE MAPS ── */
  function buildLancheMap() {
    /* membro_id → [{id, motivo, ...}] */
    const map = {};
    EG.lanches.forEach(l => {
      if (!map[l.membro_id]) map[l.membro_id] = [];
      map[l.membro_id].push(l);
    });
    return map;
  }

  /* ── RENDER ── */
  function aplicarFiltros() {
    EG.searchTerm = (document.getElementById('search-input').value || '').toLowerCase().trim();
    renderTudo();
  }

  function renderTudo() {
    /* Culto tabs */
    renderCultoTabs();
    /* Conteúdo principal */
    renderContent();
  }

  function renderCultoTabs() {
    const escDia = EG.escala.filter(e => e.data === EG.dataAtual);
    const cultosUnicos = [...new Map(escDia.map(e=>[e.culto_id, e.culto])).entries()]
            .map(([id,c])=>({id,...c}))
            .sort((a,b)=>(a.hora_inicio||'').localeCompare(b.hora_inicio||''));
    const wrap = document.getElementById('culto-tabs');
    if (cultosUnicos.length <= 1) { wrap.style.display='none'; return; }
    wrap.style.display='flex';
    wrap.innerHTML =
            `<div class="ctab ${!EG.filtroCulto?'on':''}" onclick="selCulto(null,this)">Todos</div>` +
            cultosUnicos.map(c =>
                    `<div class="ctab ${EG.filtroCulto===c.id?'on':''}" onclick="selCulto('${c.id}',this)">
          ${c.nome||'—'} ${c.campus?.nome?`<small>· ${c.campus.nome}</small>`:''} <small>${(c.hora_inicio||'').slice(0,5)}</small>
        </div>`
            ).join('');
  }

  function selCulto(id, btn) {
    EG.filtroCulto = id;
    document.querySelectorAll('#culto-tabs .ctab').forEach(el=>el.classList.remove('on'));
    btn.classList.add('on');
    renderContent();
  }

  function renderContent() {
    const lancheMap = buildLancheMap();
    let escDia = EG.escala.filter(e => e.data === EG.dataAtual);
    if (EG.filtroCulto) escDia = escDia.filter(e => e.culto_id === EG.filtroCulto);
    if (EG.searchTerm) {
      escDia = escDia.filter(e => (e.membros?.nome||'').toLowerCase().includes(EG.searchTerm));
    }

    /* Stats globais (sem filtro de busca para ser preciso) */
    const escDiaBase = EG.escala.filter(e => e.data === EG.dataAtual);
    const membrosUnicos = [...new Set(escDiaBase.map(e=>e.membro_id))];
    const total   = membrosUnicos.length;
    const comLanche = membrosUnicos.filter(id => (lancheMap[id]||[]).length >= 1).length;
    const extras  = membrosUnicos.reduce((acc,id)=>acc + Math.max(0,(lancheMap[id]||[]).length - 1), 0);
    document.getElementById('st-total').textContent = total;
    document.getElementById('st-ok').textContent    = comLanche;
    document.getElementById('st-pend').textContent  = total - comLanche;
    document.getElementById('st-extra').textContent = extras;

    const el = document.getElementById('content');

    if (!escDia.length) {
      el.innerHTML = `<div class="empty-box"><div class="empty-title">Sem escalas</div><div>Sem voluntários nesta seleção.</div></div>`;
      return;
    }

    /* Mapa ministérios */
    const minMap = {};
    EG.ministerios.forEach(m => { minMap[m.id] = m; });

    /* Agrupar por ministério */
    const porMin = {};
    escDia.forEach(e => {
      if (!porMin[e.ministerio_id]) porMin[e.ministerio_id] = [];
      porMin[e.ministerio_id].push(e);
    });

    /* Pilar lookup */
    function getPilar(min) {
      let cur = min;
      while (cur) { if (cur.tipo==='pilar') return cur; cur=minMap[cur.parent_id]; }
      return null;
    }
    const minsComEsc = Object.keys(porMin).map(id=>minMap[id]).filter(Boolean);
    const porPilar = {};
    minsComEsc.forEach(m => {
      const p = getPilar(m);
      const key = p ? p.id : '__';
      if (!porPilar[key]) porPilar[key] = { pilar:p, mins:[] };
      porPilar[key].mins.push(m);
    });

    let html = buildDateNav();

    Object.values(porPilar).forEach(({pilar,mins}) => {
      html += `<div class="pilar-section">`;
      if (pilar) {
        const minsTotais = mins.reduce((a,m)=>a+(porMin[m.id]||[]).length,0);
        const minsOk = mins.reduce((a,m)=>a+(porMin[m.id]||[]).filter(e=>(lancheMap[e.membro_id]||[]).length>=1).length,0);
        html += `<div class="pilar-hd">
          <div class="pilar-nome">${pilar.nome}</div>
          <div class="pilar-stat">${minsOk}/${minsTotais} lanches</div>
        </div>`;
      }
      mins.sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
      mins.forEach(min => {
        html += buildAreaSection(min, porMin[min.id]||[], lancheMap);
      });
      html += `</div>`;
    });

    el.innerHTML = html;
  }

  function buildDateNav() {
    const idx = EG.datas.indexOf(EG.dataAtual);
    const prevBtn = idx > 0
            ? `<button class="date-nav-btn" onclick="navData(-1)">← Ant.</button>` : '';
    const nextBtn = idx < EG.datas.length-1
            ? `<button class="date-nav-btn" onclick="navData(1)">Prox. →</button>` : '';
    return `<div class="date-hd">
      <div class="date-hd-label">${dataLbl(EG.dataAtual)}</div>
      <div class="date-hd-nav">${prevBtn}${nextBtn}</div>
    </div>`;
  }

  function navData(n) {
    const idx = EG.datas.indexOf(EG.dataAtual);
    const novo = EG.datas[idx + n];
    if (novo) { EG.dataAtual = novo; renderTudo(); }
  }

  function buildAreaSection(min, escMin, lancheMap) {
    const total = escMin.length;
    const ok = escMin.filter(e=>(lancheMap[e.membro_id]||[]).length>=1).length;

    const aspOk   = ok > 0 ? `<div class="area-stat-pill asp-ok">✓ ${ok} lanches</div>` : '';
    const aspPend = total-ok > 0 ? `<div class="area-stat-pill asp-pend">${total-ok} por receber</div>` : '';

    /* Deduplicar voluntários (podem ter 2 cultos no mesmo dia) */
    const seen = new Set();
    const vols = escMin.filter(e => {
      if (seen.has(e.membro_id)) return false;
      seen.add(e.membro_id); return true;
    });

    let volsHtml = vols.map(e => buildVolCard(e, lancheMap, min)).join('');

    return `<div class="area-hd">
      <div class="area-nome">${min.nome}</div>
      <div class="area-stats">${aspOk}${aspPend}</div>
    </div>
    ${volsHtml}`;
  }

  function buildVolCard(e, lancheMap, min) {
    const lanches = lancheMap[e.membro_id] || [];
    const count = lanches.length;
    const extra = count > 1;
    const foto = e.membros?.foto_url;
    const nome = e.membros?.nome || '—';
    const ini = iniciais(nome);

    const avatarHtml = foto
            ? `<div class="vol-avatar${count>0?' has-lanche':''}"><img src="${foto}" alt="" onerror="this.style.display='none'"><div class="vol-avatar-initials">${ini}</div></div>`
            : `<div class="vol-avatar"><div class="vol-avatar-initials">${ini}</div></div>`;

    let lcHtml, btnHtml;
    if (count === 0) {
      lcHtml = `<div class="lanche-count lc-none">0 lanches</div>`;
      btnHtml = `<button class="btn-dar" onclick="abrirConfirmar('${e.membro_id}','${min.id}','${nomeSafe(nome)}','${(foto||'')}','${min.nome}')">Dar Lanche</button>`;
    } else if (count === 1 && !extra) {
      lcHtml = `<div class="lanche-count lc-ok">✓ ${count} lanche</div>`;
      btnHtml = `<button class="btn-extra" onclick="abrirExtra('${e.membro_id}','${min.id}','${nomeSafe(nome)}','${(foto||'')}','${min.nome}',${count})">+ Extra</button>`;
    } else {
      lcHtml = `<div class="lanche-count lc-extra">⚡ ${count} lanches</div>`;
      btnHtml = `<button class="btn-extra" onclick="abrirExtra('${e.membro_id}','${min.id}','${nomeSafe(nome)}','${(foto||'')}','${min.nome}',${count})">+ Extra</button>`;
    }

    const cardClass = count===0?'':count===1?'has-lanche':'has-extra';
    return `<div class="vol-card ${cardClass}" id="card-${e.membro_id}">
      ${avatarHtml}
      <div class="vol-info">
        <div class="vol-nome">${nome}</div>
        <div class="vol-meta">
          <span class="vol-area-tag">${min.nome}</span>
        </div>
      </div>
      <div class="vol-actions">
        ${lcHtml}
        ${btnHtml}
      </div>
    </div>`;
  }

  function nomeSafe(n) { return (n||'').replace(/'/g,"\\'"); }

  /* ── MODAL: PRIMEIRO LANCHE ── */
  let pendente = null;

  function abrirConfirmar(membroId, minId, nome, foto, areaNome) {
    pendente = { membroId, minId, nome, foto, areaNome, tipo:'primeiro' };
    const avEl = document.getElementById('mc-avatar');
    const iniEl = document.getElementById('mc-ini');
    iniEl.textContent = iniciais(nome);
    /* foto */
    const existing = avEl.querySelector('img');
    if (existing) existing.remove();
    if (foto) {
      const img = document.createElement('img');
      img.src = foto; img.alt = '';
      img.onerror = () => img.style.display='none';
      avEl.insertBefore(img, iniEl);
    }
    document.getElementById('mc-nome').textContent = nome;
    document.getElementById('mc-area').textContent = areaNome;
    abrirModal('modal-confirmar');
  }

  async function confirmarLanche() {
    if (!pendente) return;
    const btn = document.getElementById('mc-ok');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await rpc('registar_lanche_vds26', {
        p_membro_id: pendente.membroId,
        p_ministerio_id: pendente.minId,
        p_motivo: null,
        p_registado_por: getOp()
      });
      if (!res.success) throw new Error(res.error);
      fecharModal('modal-confirmar');
      showToast(`✓ Lanche registado para ${pendente.nome}`);
      await carregarLanches();
    } catch(e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '✓ Entregar';
      pendente = null;
    }
  }

  /* ── MODAL: LANCHE EXTRA ── */
  function abrirExtra(membroId, minId, nome, foto, areaNome, count) {
    pendente = { membroId, minId, nome, foto, areaNome, tipo:'extra' };
    document.getElementById('me-sub').textContent = `${nome} já recebeu ${count} lanche${count>1?'s':''}. Indica o motivo para autorizar mais um.`;
    const avEl = document.getElementById('me-avatar');
    const iniEl = document.getElementById('me-ini');
    iniEl.textContent = iniciais(nome);
    const existing = avEl.querySelector('img');
    if (existing) existing.remove();
    if (foto) {
      const img = document.createElement('img');
      img.src = foto; img.alt = '';
      img.onerror = () => img.style.display='none';
      avEl.insertBefore(img, iniEl);
    }
    document.getElementById('me-nome').textContent = nome;
    document.getElementById('me-area').textContent = areaNome;
    document.getElementById('me-motivo').value = '';
    abrirModal('modal-extra');
    setTimeout(() => document.getElementById('me-motivo').focus(), 300);
  }

  async function confirmarExtra() {
    if (!pendente) return;
    const motivo = document.getElementById('me-motivo').value.trim();
    if (!motivo) { showToast('Escreve o motivo para o lanche extra.', true); return; }
    const btn = document.getElementById('me-ok');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await rpc('registar_lanche_vds26', {
        p_membro_id: pendente.membroId,
        p_ministerio_id: pendente.minId,
        p_motivo: motivo,
        p_registado_por: getOp()
      });
      if (!res.success) throw new Error(res.error);
      fecharModal('modal-extra');
      showToast(`✓ Lanche extra autorizado para ${pendente.nome}`);
      await carregarLanches();
    } catch(e) {
      showToast(e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = '✓ Autorizar';
      pendente = null;
    }
  }

  /* ── FECHAR MODAIS COM ESC ── */
  document.addEventListener('keydown', e => {
    if (e.key==='Escape') {
      fecharModal('modal-confirmar');
      fecharModal('modal-extra');
    }
  });

  /* Clicar fora fecha */
  ['modal-confirmar','modal-extra'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e){
      if (e.target === this) fecharModal(id);
    });
  });

  /* ── REFRESH ── */
  async function recarregar() {
    await carregarLanches();
    showToast('Dados actualizados');
  }

  /* ── START ── */
  init();
</script>
</body>
</html>
